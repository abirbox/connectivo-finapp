/* ---- Documents: month folders, thumbnails, preview ---- */
const DOC_BLOB_CACHE = {};
function docKind(d){
  const ct = String(d.contentType||'').toLowerCase(), n = String(d.name||'').toLowerCase();
  if(ct.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp|svg)$/.test(n)) return 'image';
  if(ct==='application/pdf' || n.endsWith('.pdf')) return 'pdf';
  if(/\.(xlsx?|csv)$/.test(n) || ct.includes('spreadsheet') || ct.includes('excel') || ct==='text/csv') return 'sheet';
  if(/\.(docx?|rtf|txt)$/.test(n) || ct.includes('word') || ct.startsWith('text/')) return 'doc';
  return 'file';
}
function docExt(d){ const m = /\.([a-z0-9]+)$/i.exec(d.name||''); return m ? m[1].toUpperCase().slice(0,4) : 'FILE'; }
function docSizeLabel(b){
  if(!b) return '—';
  if(b >= 1024*1024) return (b/1048576).toFixed(1)+' MB';
  return Math.max(1, Math.round(b/1024))+' KB';
}
/** PDFs stored as data: URLs (standalone mode) don't render in frames, so give them a blob: URL. */
function docViewSrc(d){
  const href = attachmentHref(d);
  if(d.localData && docKind(d)==='pdf'){
    if(!DOC_BLOB_CACHE[d.id]){
      try{
        const parts = d.localData.split(','), mime = (/data:([^;,]+)/.exec(parts[0])||[])[1] || 'application/pdf';
        const bin = atob(parts[1]), arr = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
        DOC_BLOB_CACHE[d.id] = URL.createObjectURL(new Blob([arr], {type:mime}));
      }catch(e){ return href; }
    }
    return DOC_BLOB_CACHE[d.id];
  }
  return href;
}
function docMonthKey(d){
  const tx = d.transactionId ? S.transactions.find(t=>t.id===d.transactionId) : null;
  const iso = (tx && tx.date) || (d.uploadedAt||'').slice(0,10);
  return iso ? iso.slice(0,7) : 'unknown';
}
function docMonthLabel(key){
  if(key==='unknown') return 'Undated';
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-GB', {month:'long', year:'numeric'});
}
function docThumbHtml(d){
  const k = docKind(d), ext = esc(docExt(d));
  if(k==='image') return `<span class="dthumb"><img loading="lazy" src="${attachmentHref(d)}" alt=""></span>`;
  if(k==='pdf') return `<span class="dthumb pdf"><span class="dext">PDF</span><iframe loading="lazy" tabindex="-1" aria-hidden="true" src="${docViewSrc(d)}#toolbar=0&navpanes=0&scrollbar=0&view=FitH"></iframe></span>`;
  return `<span class="dthumb ${k}"><span class="dext">${ext}</span></span>`;
}

function renderDocuments(){
  setTitle('Documents', 'Every file attached to a transaction, organised by month');
  dbList('documents').then(docs=>{
    docs.sort((a,b)=> (b.uploadedAt||'').localeCompare(a.uploadedAt||''));
    const q = (S.docQuery||'').trim().toLowerCase();
    const matches = d => !q || [d.name, d.voucher, d.uploadedByName].filter(Boolean).join(' ').toLowerCase().includes(q);
    const folders = {};
    docs.forEach(d=>{ const k = docMonthKey(d); (folders[k] = folders[k] || {key:k, docs:[], bytes:0}); folders[k].docs.push(d); folders[k].bytes += (d.sizeBytes||0); });
    const keys = Object.keys(folders).sort().reverse();
    if(!S.docMonth || !folders[S.docMonth]) S.docMonth = keys[0] || null;
    const cur = S.docMonth ? folders[S.docMonth] : null;
    const shown = cur ? cur.docs.filter(matches) : [];
    const totalBytes = docs.reduce((s,d)=>s+(d.sizeBytes||0),0);

    if(!docs.length){
      $('#content').innerHTML = `<div class="card"><div class="empty"><h3>No documents yet</h3><p>Attach supporting documents when recording income or expenditure. They'll be filed here by month.</p></div></div>`;

        <div class="doc-sum"><b>${docs.length}</b> file${docs.length!==1?'s':''} in <b>${keys.length}</b> folder${keys.length!==1?'s':''} · ${docSizeLabel(totalBytes)}</div>

      </div>
      <div class="folders" role="tablist" aria-label="Month folders">

          <span class="fico"></span>
          <span class="ftxt"><b>${esc(docMonthLabel(k))}</b><small>${folders[k].docs.length} file${folders[k].docs.length!==1?'s':''} · ${docSizeLabel(folders[k].bytes)}</small></span>
        </button>`).join('')}

        <div class="card-pad viewport-narrow" style="padding-top:8px;">
          ${shown.length ? `<table class="doc-table"><thead><tr><th style="width:64px;">Preview</th><th>File</th><th>Voucher</th><th>Uploaded by</th><th>Uploaded on</th><th class="right">Size</th><th style="width:44px;"></th></tr></thead><tbody>
            ${shown.map((d,i)=>`<tr data-doc="${i}">
              <td>${docThumbHtml(d)}</td>

              <td data-label="Voucher" style="font-weight:600; white-space:nowrap;">${esc(d.voucher||'—')}</td>
              <td data-label="Uploaded by">${esc(d.uploadedByName||'—')}</td>
              <td data-label="Uploaded on" style="white-space:nowrap;">${fmtDateTime(d.uploadedAt)}</td>
              <td data-label="Size" class="right" style="white-space:nowrap;">${docSizeLabel(d.sizeBytes)}</td>
              <td><a class="icon-btn" href="${attachmentHref(d)}" download="${esc(d.name)}" data-stop title="Download" aria-label="Download ${esc(d.name)}">${ICONS('download')}</a></td>
            </tr>`).join('')}
          </tbody></table>` : `<div class="empty" style="padding:40px 16px;"><h3>No matching files</h3><p>Try a different search, or pick another month folder.</p></div>`}
        </div>
      </div>
      <p style="font-size:12px; color:var(--ink-faint); margin-top:12px;">Files are filed under the month of the transaction they support (or the upload month when no transaction is linked). Click a row to preview.</p>
    `;

/** A stronger confirmation than the usual void/suspend dialogs — used
 * only for developer-only, irreversible actions (hard delete, wiping a
 * collection). Requires typing an exact phrase before the action fires. */
function openDangerConfirm({title, message, confirmPhrase, confirmLabel, onConfirm}){
  showModal(`
    <div class="modal-head"><h3 style="color:var(--danger);">${esc(title)}</h3><button class="modal-close" data-close>${ICONS('x')}</button></div>
    <div class="modal-body">
      <p style="font-size:13px; color:var(--ink-soft); margin-top:0; line-height:1.6;">${message}</p>
      <div class="field"><label>Type <strong>${esc(confirmPhrase)}</strong> to confirm</label><input id="dangerInput" autocomplete="off"></div>
      <div id="dangerErr" class="err" style="display:none;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-danger" id="dangerConfirmBtn">${esc(confirmLabel||'Confirm')}</button>
    </div>
  `);
  $('#dangerConfirmBtn').onclick = async ()=>{
    if($('#dangerInput').value.trim() !== confirmPhrase){
      $('#dangerErr').textContent = `Please type "${confirmPhrase}" exactly.`;
      $('#dangerErr').style.display = 'block';
      return;
    }
    const btn = $('#dangerConfirmBtn'); btn.disabled = true; btn.textContent = 'Working…';
    try{ await onConfirm(); closeModal(); }
    catch(e){ toast(e && e.message ? e.message : 'That action failed. Please try again.', 'error'); btn.disabled=false; btn.textContent = confirmLabel||'Confirm'; }
  };
}

/* ================= STANDALONE (non-claude.ai) FALLBACK ================= */
// This file is also meant to be downloaded and hosted on the person's own
// static host (Netlify, GitHub Pages, ...). Outside claude.ai there is no
// window.claude, so none of the db/user/assets/downloads capabilities
// exist. createLocalDb() implements the same minimal surface our code
// calls (collection().limit().get(), doc().get()/set()/update()) backed by
// localStorage, so every screen keeps working — with the honest trade-off
// that data then lives only in that one browser, on that one device, with
// no real access control. We tell the person this plainly in the gate.
const LOCAL_DB_KEY = 'connectivo_finops_local_db_v1';
function createLocalDb(){
  const readAll = ()=>{ try{ return JSON.parse(localStorage.getItem(LOCAL_DB_KEY)||'{}'); }catch(e){ return {}; } };
  const writeAll = obj => localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(obj));
  return {
    collection(name){
      return {
        limit(){ return this; },
        async get(){
          const all = (readAll()[name]) || {};
          const docs = Object.keys(all).map(id=>({id, exists:true, data:()=>all[id]}));
          return {docs};
        },
      };
    },
    doc(path){
      const parts = path.split('/'); const name = parts[0], id = parts[1];
      return {
        id,
        async get(){
          const all = (readAll()[name]) || {};
          const exists = Object.prototype.hasOwnProperty.call(all, id);
          return {id, exists, data: ()=> exists ? all[id] : undefined};
        },
        async set(data){
          const all = readAll(); all[name] = all[name] || {};
          all[name][id] = JSON.parse(JSON.stringify(data));
          writeAll(all);
        },
        async update(data){
          const all = readAll(); all[name] = all[name] || {};
          if(!Object.prototype.hasOwnProperty.call(all[name], id)) throw {code:'invalid_argument', message:'document does not exist'};
          all[name][id] = {...all[name][id], ...JSON.parse(JSON.stringify(data))};
          writeAll(all);
        },
        async delete(){ const all = readAll(); if(all[name]) delete all[name][id]; writeAll(all); },
      };
    },
  };
}
/** Real backend mode: when this file is deployed on Netlify alongside the
 * netlify/functions in this package, every read/write goes through those
 * authenticated Functions instead of claude.ai's capabilities or
 * localStorage. This shim exposes the exact same collection()/doc()
 * shape as createLocalDb(), so none of the rest of the app needs to know
 * which backend it's talking to. */
function createNetlifyDb(){
  async function callData(payload){
    const res = await fetch('/api/data', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    let json = null;
    try{ json = await res.json(); }catch(e){}
    if(res.status===401) throw {code:'not_signed_in', message:(json&&json.error)||'Session expired.'};
    if(!res.ok) throw {code:'server_error', message:(json&&json.error)||'Request failed.'};
    return json || {};
  }
  const stripId = d => { const {id, ...rest} = d; return rest; };
  return {
    collection(name){
      return {
        limit(){ return this; },
        async get(){
          const r = await callData({op:'list', collection:name});
          const docs = (r.docs||[]).map(d=>({id:d.id, exists:true, data:()=>stripId(d)}));
          return {docs};
        },
      };
    },
    doc(path){
      const [name, id] = path.split('/');
      return {
        id,
        async get(){
          const r = await callData({op:'get', collection:name, id});
          const doc = r.doc;
          return {id, exists: !!doc, data: ()=> doc ? stripId(doc) : undefined};
        },
        async set(data){ await callData({op:'set', collection:name, id, data}); },
        async update(data){ await callData({op:'update', collection:name, id, data}); },
        async delete(){ await callData({op:'delete', collection:name, id}); },
      };
    },
  };
}
/** Probes for a server backend (Netlify Functions, Cloudflare Pages
 * Functions, or any host serving the same /api/* contract) deployed
 * alongside this same package. A
 * plain static deploy (no functions/env vars configured) will 404 here
 * and the app quietly falls back to local-storage mode instead of
 * breaking — same file works either way. */
async function detectNetlifyFunctions(){
  try{
    const res = await fetch('/api/auth/session', {credentials:'include'});
    if(res.status===404) return false;
    const data = await res.json().catch(()=>null);
    return !!data && (typeof data.ok !== 'undefined' || typeof data.error !== 'undefined');
  }catch(e){ return false; }
}

/** Unified file-save: uses the claude.ai downloads capability (a plain
 * <a download> is inert inside the published artifact's sandboxed frame)
 * when available, and a normal browser download otherwise (which is what
 * runs once this file is self-hosted). */
async function triggerDownload(filename, data){
  if(S.mode==='claude'){

  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ================= CREDENTIAL LOGIN =================
 * IMPORTANT, READ THIS: this app is a single static HTML/JS file with no
 * server. There is NO way for client-side code to keep a secret truly
 * secret — anyone who has the file (view-source, browser devtools, or the
 * GitHub repo it's pushed to) can read everything below. Passwords are
 * stored as salted SHA-256 hashes rather than plaintext, which stops a
 * casual glance from revealing them outright, but it is NOT cryptographic
 * security: a hash is reversible-by-brute-force offline, and there is no
 * rate limiting because there is no server to enforce one. Treat this as
 * a locked office door, not a bank vault — it keeps out people who don't
 * have the credentials, not a determined technical attacker with the file
 * in hand. The claude.ai-hosted copy of this app has a real, independent
 * security layer on top of this (claude.ai's own account + sharing
 * permissions on who can even open the link at all); the self-hosted
 * static copy relies on this login ALONE, which is materially weaker.
 */
const ACCOUNTS = [
  {username:'shanto',  hash:'7cd2f1c4fd6cfc3ff3c2b95330d6313bb241654ed19e97504a85d3284c446775', role:'developer', name:'Shanto',  uid:'user-shanto'},
  {username:'shomvob', hash:'7c1c51c400ed32181b1f1e5bd3cf8eb1aa8b66941d7594d2c538134df9b9ea8f', role:'ceo',       name:'Shomvob', uid:'user-shomvob'},
  {username:'shoikot', hash:'21b0733df511c6b07c6aa55706622bbfcb8591bb3c8775c6e028b979118ab794', role:'admin',     name:'Shoikot', uid:'user-shoikot'},
  {username:'abir',    hash:'ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f', role:'developer', name:'Abir',    uid:'user-abir'},
];
const SESSION_KEY = 'connectivo_finops_session_v1';
async function sha256Hex(str){
  if(!(window.crypto && window.crypto.subtle)){
    // Web Crypto needs a secure context (https:// or localhost). Opening
    // the downloaded file directly as file:// can land here in some
    // browsers — surface it plainly instead of failing silently.
    throw new Error('SECURE_CONTEXT_REQUIRED');
  }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkCredentials(username, password){
  const u = (username||'').trim().toLowerCase();
  const acct = ACCOUNTS.find(a=>a.username===u);
  if(!acct) { await sha256Hex('dummy-timing-equalizer'); return null; } // still hash something so a bad username doesn't respond measurably faster
  const salt = 'connectivo-finops::' + acct.username;
  const hash = await sha256Hex(salt + '::' + (password||''));
  return hash === acct.hash ? acct : null;
}

    // keep the splash until the portal has really rendered (and at least 2 seconds)
    const chk=()=>{ const c=document.getElementById('content'), ok=document.getElementById('topbar')&&c&&c.children.length&&!document.getElementById('lgBtn');
      if((ok && Date.now()-t0>=2000) || Date.now()-t0>15000){ setTimeout(()=>dismissSplash(),250); } else setTimeout(chk,150); };
    setTimeout(chk,300); };
  const submit = async ()=>{
    const user = $('#lg_user').value, pass = $('#lg_pass').value;
    const btn = $('#lgBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
    const errEl = $('#lgErr');
    const fail = msg => { errEl.textContent = msg; errEl.style.display='block'; btn.disabled=false; btn.textContent='Sign In'; };

    if(serverMode){
      try{
        const res = await fetch('/api/auth/login', {
          method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username:user, password:pass}),
        });
        const data = await res.json().catch(()=>({}));
        // BUG FIX: this used to fall back to "Incorrect username or
        // password" for ANY failed response, including genuine server
        // errors (500s, thrown exceptions, unparseable bodies) — which
        // silently disguised real backend bugs as if they were login
        // mistakes. Only an actual 401 means the credentials were wrong;
        // anything else should say so honestly.
        if(!res.ok || !data.ok){
          if(res.status === 401) return fail(data.error || 'Incorrect username or password.');
          return fail(data.error || `Something went wrong signing in (server responded with status ${res.status}). This is likely a backend problem, not your password — please try again or contact whoever manages this deployment.`);
        }
        S.uid = data.uid; S.me.name = data.name; S.me.role = data.role; S.me.perms = data.perms || null;
        loginSplash();
      }catch(e){ fail('Could not reach the server. Check your connection and try again.'); }
      return;
    }

    let acct;
    try{ acct = await checkCredentials(user, pass); }
    catch(e){
      return fail(e.message==='SECURE_CONTEXT_REQUIRED'
        ? 'This browser blocked the sign-in check because the page was opened directly from a file, not a web address. Serve it over https:// (or localhost).'
        : 'Something went wrong checking your credentials. Please try again.');
    }
    if(!acct) return fail('Incorrect username or password.');
    S.uid = acct.uid; S.me.name = acct.name; S.me.role = acct.role;
    try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify({uid:acct.uid})); }catch(e){}
    loginSplash();
  };
  $('#lgBtn').onclick = submit;
  $('#lg_pass').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  $('#lg_user').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#lg_pass').focus(); });
}

/* ================= INIT ================= */
async function init(){
  // Connect to storage first — claude.ai's shared db, this package's own
  // any compatible server backend (Netlify or Cloudflare) if it's deployed and reachable, or
  // the local-storage fallback as a last resort. Independent of login.
  let dbCap = null;
  if(window.claude){
    try{ await claude.use('user'); }catch(e){}
    try{ dbCap = await claude.use('db'); }catch(e){}
  }
  if(dbCap){ S.mode = 'claude'; S.db = dbCap; }
  else if(await detectNetlifyFunctions()){ S.mode = 'server'; S.db = createNetlifyDb(); }
  else { S.mode = 'local'; S.db = createLocalDb(); }

  const afterLogin = async ()=>{
    if(S.mode==='server'){
      const profile = await fetchOwnProfile();
      if(profile && profile.ok){ S.me.name = profile.name; S.me.username = profile.username; S.me.avatarId = profile.avatarId; S.me.perms = profile.perms || null; }
    }
    await refetchAll();
    await seedIfEmpty();
    await refetchAll();
    // Per-account status doc (CEO/Developer can suspend Admin's access,
    // etc.) — independent of the fixed username/password/role table.
    let statusDoc = await dbGetDoc('roles', S.uid);
    if(!statusDoc){
      statusDoc = {name:S.me.name, role:S.me.role, status:'active', addedAt:new Date().toISOString()};
      try{ await dbSet('roles', S.uid, statusDoc); }catch(e){}
    }
    if(statusDoc.status==='suspended'){
      gateShell(`
        <h2 style="margin-bottom:8px; font-size:18px;">Access suspended</h2>
        <p style="color:var(--ink-soft); font-size:13.5px;">Your access to Connectivo FinOps has been suspended by a CEO-level user. Contact your CEO to restore access.</p>
      `);
      return;
    }
    // The developer account is a disclosed, known maintenance account now
    // (not hidden from CEO/Admin), so its sign-ins are logged like anyone
    // else's rather than being left out of the audit trail.
    await logAudit('USER_LOGIN','user',S.uid, `${S.me.name} signed in.`);
    await refetchAll();
    S.ready = true;
    renderRoute();
  };

  if(S.mode==='server'){
    // The httpOnly session cookie itself is the "remember me" — no
    // sessionStorage needed, and it survives a full reload or new tab
    // until it actually expires (8 hours) or is explicitly signed out.
    try{
      const res = await fetch('/api/auth/session', {credentials:'include'});
      if(res.ok){
        const data = await res.json();
        S.uid = data.uid; S.me.name = data.name; S.me.role = data.role; S.me.perms = data.perms || null;
        await afterLogin();
        return;
      }
    }catch(e){}
    renderLoginGate(afterLogin, true);
    return;
  }

  // claude / local modes: a same-tab sessionStorage flag skips re-typing
  // the password on every hash change or accidental reload, without ever
  // persisting it across a fresh visit.
  let resumed = null;
  try{ resumed = JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null'); }catch(e){}
  if(resumed && resumed.uid){
    const acct = ACCOUNTS.find(a=>a.uid===resumed.uid);
    if(acct){ S.uid = acct.uid; S.me.name = acct.name; S.me.role = acct.role; await afterLogin(); return; }
  }
  renderLoginGate(afterLogin, false);
}
init();

</script>
