async function exportCSV(list){
  const header = ['Date','Voucher','Type','Party','Category','Business Unit','Account','Amount','Currency','Reference','Status','Description'];
  const rows = list.map(t=>{
    const cat = S.categories.find(c=>c.id===t.categoryId);
    const bu = S.businessUnits.find(b=>b.id===t.businessUnitId);
    const acc = S.accounts.find(a=>a.id===t.accountId);
    return [t.date,t.voucher,t.type,t.party||'',cat?cat.name:'',bu?bu.name:'',acc?acc.name:'',t.amount,t.currency||'BDT',t.reference||'',t.status,(t.description||'').replace(/[\r\n]+/g,' ')];
  });
  const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  await triggerDownload(`connectivo-finops-transactions-${todayISO()}.csv`, csv);
}

      <label class="btn btn-ghost btn-sm" style="margin-top:8px; cursor:pointer;">${ICONS('paperclip')} Attach a document<input type="file" id="txAttach" style="display:none;"></label>
      <div class="form-section-label">Activity</div>
      <div style="font-size:12.5px; color:var(--ink-soft);">
        Recorded by ${esc(t.createdByName||'—')} on ${fmtDateTime(t.createdAt)}
        ${t.editedAt? `<br>Last edited by ${esc(t.editedByName||'—')} on ${fmtDateTime(t.editedAt)}` : ''}
        ${t.status==='voided'? `<br><span style="color:var(--danger); font-weight:600;">Voided by ${esc(t.voidedByName||'—')} on ${fmtDateTime(t.voidedAt)}</span><br>Reason: ${esc(t.voidReason||'—')} <span style="color:var(--ink-faint);">(legacy record from before editing was enabled)</span>` : ''}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="voucherPdfBtn">${ICONS('download')} Voucher PDF</button>
      ${canManage? `<button class="btn btn-danger" id="deleteBtn">Delete</button>`:''}
      ${canManage? `<button class="btn btn-ghost" id="editBtn">Edit</button>`:''}
      <button class="btn btn-ghost" data-close>Close</button>
    </div>
  `);
  const editBtn = $('#editBtn');
  if(editBtn) editBtn.onclick = ()=>{ closeModal(); openRecordModal(t.type, t); };
  const delBtn = $('#deleteBtn');
  if(delBtn) delBtn.onclick = ()=> openDeleteModal(t);
  $('#voucherPdfBtn').onclick = async (e)=>{ e.target.disabled=true; e.target.textContent='Generating…'; try{ await downloadVoucherPdf(t); }catch(err){ toast('Unable to generate the PDF.', 'error'); } finally { e.target.disabled=false; e.target.innerHTML = ICONS('download')+' Voucher PDF'; } };

  const loadDocs = async ()=>{
    const all = docIds.length ? await Promise.all(docIds.map(did=>dbGetDoc('documents', did))) : [];
    const docs = all.filter(Boolean);
    const el = $('#txDocs'); if(el) el.innerHTML = attachmentListHtml(docs);
  };
  loadDocs();
  const attachInput = $('#txAttach');
  if(attachInput) attachInput.onchange = async ()=>{
    const file = attachInput.files[0]; if(!file) return;
    try{
      const newId = await uploadAttachment(file, t.id, t.voucher);
      const updated = [...docIds, newId];
      await dbUpdate('transactions', t.id, {documentIds: updated});
      await logAudit('DOCUMENT_UPLOADED','transaction', t.id, `${file.name} attached to ${t.voucher}`);
      toast('Document attached.', 'success');
      t.documentIds = updated;
      await refetchAll();
      loadDocs();
    }catch(err){ toast('Unable to attach that document.', 'error'); }
  };
}

function openDeleteModal(t){
  showModal(`
    <div class="modal-head"><h3>Delete ${esc(t.voucher)}</h3><button class="modal-close" data-close>${ICONS('x')}</button></div>
    <div class="modal-body">
      <p style="font-size:13px; color:var(--ink-soft); margin-top:0;">This permanently removes this transaction — it will not be recoverable and will not appear in any report afterward.</p>
      <div class="field"><label>Reason (optional, kept in the activity log)</label><textarea id="deleteReason" rows="2" placeholder="e.g. Duplicate entry."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-danger" id="confirmDelete">Delete</button>
    </div>
  `);
  $('#confirmDelete').onclick = async ()=>{
    const reason = $('#deleteReason').value.trim();
    try{
      await dbDelete('transactions', t.id);
      await logAudit('TRANSACTION_DELETED','transaction', t.id, `${t.voucher} deleted${reason?': '+reason:'.'}`, auditActorLabel());
      closeModal(); toast('Transaction deleted.', 'success');
      await refetchAll(); renderRoute();
    }catch(e){ toast('Unable to delete transaction. No change was made.', 'error'); }
  };
}

/* ================= RECORD INCOME / EXPENSE / TRANSFER ================= */
/** existingTx: omit to record a new transaction; pass an existing
 * transaction to edit it in place instead (same voucher, same id,
 * updated fields, logged as an edit rather than a new record). */
function openRecordModal(type, existingTx){
  if(!canWrite()){ toast('Your account is view-only.','error'); return; }
  const isEdit = !!existingTx;
  const isIncome = type==='income', isExpense = type==='expense', isTransfer = type==='transfer';
  const cats = S.categories.filter(c=>c.kind===type);
  const catGroups = {};
  cats.forEach(c=>{ (catGroups[c.group]=catGroups[c.group]||[]).push(c); });
  const catOpts = Object.keys(catGroups).map(g=>`<optgroup label="${esc(g)}">${catGroups[g].map(c=>`<option value="${c.id}" ${isEdit&&existingTx.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
  const buOpts = S.businessUnits.map(b=>`<option value="${b.id}" ${isEdit&&existingTx.businessUnitId===b.id?'selected':''}>${esc(b.name)}</option>`).join('');
  const accOpts = S.accounts.map(a=>`<option value="${a.id}" ${isEdit&&existingTx.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  const toAccOpts = S.accounts.map(a=>`<option value="${a.id}" ${isEdit&&existingTx.toAccountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  const actionLabel = isEdit ? 'Save Changes' : `Record ${isIncome?'Income':isExpense?'Expenditure':'Transfer'}`;

  showModal(`
    <div class="modal-head">
      <h3>${isEdit? `Edit ${esc(existingTx.voucher)}` : `Record ${isIncome?'Income':isExpense?'Expenditure':'Transfer'}`}</h3>
      <button class="modal-close" data-close>${ICONS('x')}</button>
    </div>
    <div class="modal-body">
      <div class="form-section-label">Basic Information</div>
      <div class="form-row">
        <div class="field"><label>Date *</label><input type="date" id="f_date" value="${isEdit?existingTx.date:todayISO()}"></div>
        ${!isTransfer? `<div class="field"><label>Business Unit</label><select id="f_bu"><option value="">—</option>${buOpts}</select></div>` : `<div class="field"><label>Reference</label><input id="f_ref" placeholder="Optional external reference" value="${isEdit?esc(existingTx.reference||''):''}"></div>`}
      </div>
      <div class="form-section-label">Financial Information</div>
      <div class="form-row">
        <div class="field"><label>Amount (BDT) *</label><input type="number" step="0.01" min="0" id="f_amount" placeholder="0.00" value="${isEdit?existingTx.amount:''}"></div>
        ${isTransfer
          ? `<div class="field"><label>From Account *</label><select id="f_account">${accOpts}</select></div>`
          : `<div class="field"><label>Account *</label><select id="f_account">${accOpts}</select></div>`}
      </div>
      ${isTransfer? `<div class="field"><label>To Account *</label><select id="f_toaccount">${toAccOpts}</select></div>` : `
      <div class="form-row">
        <div class="field"><label>${isIncome?'Income':'Expense'} Category *</label><select id="f_cat"><option value="">Select category…</option>${catOpts}</select></div>
        <div class="field"><label>${isIncome?'Source / Client':'Payee / Vendor'}</label><input id="f_party" placeholder="${isIncome?'e.g. Arseas Security':'e.g. WPEngine'}" value="${isEdit?esc(existingTx.party||''):''}"></div>
      </div>`}
      <div class="form-section-label">Documentation</div>
      ${!isTransfer? `<div class="field"><label>Reference Number</label><input id="f_ref" placeholder="e.g. RENT-SEP-2026" value="${isEdit?esc(existingTx.reference||''):''}"></div>`:''}
      ${isEdit? '' : `<div class="field"><label>Supporting Document</label><input type="file" id="f_files" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.xlsx,.csv"><div class="hint">PDF, image or spreadsheet. Optional — you can also attach one later from the transaction detail.</div></div>`}
      <div class="form-section-label">Additional Information</div>
      <div class="field"><label>Description</label><textarea id="f_desc" rows="2" placeholder="Optional notes">${isEdit?esc(existingTx.description||''):''}</textarea></div>
      <div id="formErr" class="err" style="display:none;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" id="submitTx">${actionLabel}</button>
    </div>
  `);

  $('#submitTx').onclick = async ()=>{
    const date = $('#f_date').value;
    const amount = parseFloat($('#f_amount').value);
    const account = $('#f_account').value;
    const errEl = $('#formErr');
    const setErr = m=>{ errEl.textContent=m; errEl.style.display='block'; };
    if(!date) return setErr('Please choose a date.');
    if(!amount || amount<=0) return setErr('Please enter an amount greater than zero.');
    if(!account) return setErr('Please choose an account.');
    let toAccount, categoryId, party, businessUnitId;
    if(isTransfer){
      toAccount = $('#f_toaccount').value;
      if(!toAccount) return setErr('Please choose a destination account.');
      if(toAccount===account) return setErr('From and To accounts must be different.');
    } else {
      categoryId = $('#f_cat').value;
      if(!categoryId) return setErr(`Please choose a ${isIncome?'income':'expense'} category.`);
      party = $('#f_party').value.trim();
      businessUnitId = $('#f_bu').value;
    }
    errEl.style.display='none';
    $('#submitTx').disabled = true; $('#submitTx').textContent = isEdit ? 'Saving…' : 'Saving…';
    try{
      if(isEdit){
        const payload = {
          date, amount, accountId:account,
          toAccountId: isTransfer? toAccount : null,
          categoryId: isTransfer? null : categoryId,
          businessUnitId: isTransfer? null : (businessUnitId||null),
          party: isTransfer? null : (party||null),
          reference: $('#f_ref')? $('#f_ref').value.trim() : '',
          description: $('#f_desc').value.trim(),
          editedBy: S.uid, editedByName: S.me.name, editedAt: new Date().toISOString(),
        };
        await dbUpdate('transactions', existingTx.id, payload);
        await logAudit('TRANSACTION_EDITED','transaction', existingTx.id, `${existingTx.voucher} edited by ${auditActorLabel()}.`, auditActorLabel());
        closeModal();
        toast(`${existingTx.voucher} updated.`, 'success');
        await refetchAll();
        renderRoute();
        return;
      }

      const voucher = await nextVoucher(type);
      const id = uuid();
      const payload = {
        voucher, type, date, amount, currency:'BDT', accountId:account,
        toAccountId: isTransfer? toAccount : null,
        categoryId: isTransfer? null : categoryId,
        businessUnitId: isTransfer? null : (businessUnitId||null),
        party: isTransfer? null : (party||null),
        reference: $('#f_ref')? $('#f_ref').value.trim() : '',
        description: $('#f_desc').value.trim(),
        status:'recorded', createdBy:S.uid, createdByName:S.me.name, createdAt:new Date().toISOString(),
      };
      await dbSet('transactions', id, payload);
      await logAudit('TRANSACTION_CREATED','transaction', id, `${voucher} — ${type} of ${money(amount)}${party?' ('+party+')':''}`);

      const fileInput = $('#f_files');
      if(fileInput && fileInput.files && fileInput.files.length){
        const ids = [];
        for(const file of Array.from(fileInput.files)){
          try{ ids.push(await uploadAttachment(file, id, voucher)); }
          catch(err){ console.error('attachment upload failed', err); toast(`${voucher} recorded, but "${file.name}" could not be attached.`, 'error'); }
        }
        if(ids.length){ try{ await dbUpdate('transactions', id, {documentIds: ids}); }catch(e){} }
      }

      closeModal();
      toast(`${voucher} recorded.`, 'success');
      await refetchAll();
      renderRoute();
    }catch(e){
      setErr(`Unable to save. No change was made. Please try again.`);
      $('#submitTx').disabled=false; $('#submitTx').textContent = actionLabel;
    }
  };
}

/* ================= PAYROLL IMPORT (from the separate Connectivo Payroll/Attendance Portal) ================= */
// FinOps never calculates salaries. It only receives the FINAL, finalized totals from the Payroll/Attendance Portal
// (through the Worker, which holds the key) and records them as ordinary Salaries expense entries.
const PAYROLL = { month:'', data:null, error:'', loading:false };
function payrollMonthLabel(m){ const a=(m||'').split('-'); const N=['January','February','March','April','May','June','July','August','September','October','November','December']; return a.length===2? N[+a[1]-1]+' '+a[0] : m; }
function payrollBuGuess(dept){
  const d=(dept||'').toLowerCase(); let want='Corporate / Administration';
  if(/c&m|monitor|dispatch|security/.test(d)) want='Security Operations';
  else if(/m&c|marketing|creative|digital/.test(d)) want='Digital Agency';
  const b=S.businessUnits.find(x=>x.name===want); return b? b.id : '';
}
function payrollRef(month, dept){ return `PAYROLL-${month}-${String(dept).toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'')}`; }
function closeInvoice(){ const o=document.getElementById('invOverlay'); if(o) o.remove(); if(!document.getElementById('salOverlay')) document.body.style.overflow=''; }
function renderInvoice(){
  closeInvoice();
  document.body.style.overflow='hidden';
  const o=document.createElement('div'); o.id='invOverlay';
  o.style.cssText='position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;background:#0a1f44';
  o.innerHTML=`<div style="flex:0 0 38px;display:flex;align-items:center;padding:0 14px;background:#0a1f44;border-bottom:1px solid rgba(255,255,255,.12)">
    <a href="#/dashboard" id="invBack" style="display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font:600 13px Inter,system-ui,sans-serif;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.12)">&#8592; Back to FinOps</a></div>
    <iframe id="invFrame" src="/invoice/?embed=1" title="Invoice Portal" style="flex:1;width:100%;border:0;background:#fff"></iframe>`;
  document.body.appendChild(o);
}
function closeProjects(){ const o=document.getElementById('prjOverlay'); if(o) o.remove(); if(!document.getElementById('salOverlay') && !document.getElementById('invOverlay')) document.body.style.overflow=''; }
function renderProjects(){
  closeProjects();
  document.body.style.overflow='hidden';
  const o=document.createElement('div'); o.id='prjOverlay';
  o.style.cssText='position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;background:#0a1f44';
  o.innerHTML=`<div style="flex:0 0 38px;display:flex;align-items:center;padding:0 14px;background:#0a1f44;border-bottom:1px solid rgba(255,255,255,.12)">
    <a href="#/dashboard" id="prjBack" style="display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font:600 13px Inter,system-ui,sans-serif;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.12)">&#8592; Back to FinOps</a></div>
    <iframe id="prjFrame" src="/projects/?embed=1" title="Projects" style="flex:1;width:100%;border:0;background:#fff"></iframe>`;

}
function closeSalary(){ const o=document.getElementById('salOverlay'); if(o) o.remove(); document.body.style.overflow=''; }
function renderSalary(){
  closeSalary();
  document.body.style.overflow='hidden';
  const o=document.createElement('div'); o.id='salOverlay';
  o.style.cssText='position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;background:#0a1f44';
  o.innerHTML=`<div style="flex:0 0 38px;display:flex;align-items:center;padding:0 14px;background:#0a1f44;border-bottom:1px solid rgba(255,255,255,.12)">
    <a href="#/dashboard" id="salBack" style="display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font:600 13px Inter,system-ui,sans-serif;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.12)">&#8592; Back to FinOps</a></div>
    <iframe id="salFrame" src="/salary/?embed=1" title="Payroll/Attendance Portal" style="flex:1;width:100%;border:0;background:#fff"></iframe>`;
  document.body.appendChild(o);
}
function renderPayroll(){
  setTitle('Payroll Import', 'Bring finalized salary totals from the Payroll/Attendance Portal into the ledger');
  if(!PAYROLL.month){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); PAYROLL.month = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  const D = PAYROLL.data;
  const salCat = S.categories.find(c=>c.kind==='expense' && c.name==='Salaries');
  let body = '';
  if(PAYROLL.loading) body = `<div class="card card-pad">Contacting the Payroll/Attendance Portal…</div>`;
  else if(PAYROLL.error) body = `<div class="card card-pad" style="border-left:4px solid #c0392b;">${esc(PAYROLL.error)}</div>`;
  else if(D){
    const rows = D.departments||[];
    const existing = r => S.transactions.find(t=>t.reference===payrollRef(D.month, r.name) && t.status!=='voided');
    body = `
      ${D.notFinalizedEmployees>0? `<div class="card card-pad" style="border-left:4px solid #d68910; margin-bottom:12px;">${D.notFinalizedEmployees} active employee(s) do not have a finalized payslip for ${esc(payrollMonthLabel(D.month))}. Only finalized payslips are included below.</div>`:''}
      ${rows.length? `<div class="card card-pad">
        <div class="filters" style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
          <label style="font-size:12px;">Pay from account<br><select id="pyAcc">${S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>
          <label style="font-size:12px;">Date of payment<br><input type="date" id="pyDate" value="${new Date().toISOString().slice(0,10)}"></label>
          <div style="font-size:12px; align-self:end;">Category: <b>${salCat? 'Salaries' : '— (create an expense category named “Salaries” first)'}</b></div>
        </div>
        <table class="tx-table"><thead><tr><th></th><th>Department</th><th style="text-align:right;">Employees</th><th style="text-align:right;">Net pay (BDT)</th><th>Business unit</th><th>Status</th></tr></thead><tbody>
        ${rows.map((r,i)=>{ const ex=existing(r); return `<tr>
          <td><input type="checkbox" class="pyChk" data-i="${i}" ${ex?'disabled':'checked'}></td>
          <td>${esc(r.name)}</td><td style="text-align:right;">${r.employees}</td><td style="text-align:right;">${money(r.net)}</td>
          <td><select class="pyBu" style="min-width:190px" data-i="${i}"><option value="">—</option>${S.businessUnits.map(b=>`<option value="${b.id}" ${b.id===payrollBuGuess(r.name)?'selected':''}>${esc(b.name)}</option>`).join('')}</select></td>
          <td>${ex? `Already recorded (${esc(ex.voucher)})` : 'Ready'}</td></tr>`; }).join('')}
        </tbody><tfoot><tr><td></td><td><b>Total</b></td><td style="text-align:right;"><b>${D.totals.employees}</b></td><td style="text-align:right;"><b>${money(D.totals.net)}</b></td><td colspan="2" style="font-size:12px;">Earnings ${money(D.totals.earnings)} · Deductions ${money(D.totals.deductions)} · Pardoned ${money(D.totals.pardoned)} · Overtime ${money(D.totals.overtime)}</td></tr></tfoot></table>
        <div style="margin-top:14px;"><button class="btn btn-primary btn-sm" id="pyRecord" ${salCat?'':'disabled'}>Record selected as expenses</button>
        <span style="font-size:12px; color:var(--ink-soft); margin-left:10px;">One expense entry per department, amount = net pay actually paid out. Nothing is changed in the Payroll/Attendance Portal.</span></div>
      </div>` : `<div class="card card-pad">No finalized payslips for ${esc(payrollMonthLabel(D.month))} yet. Finalize them in the Payroll/Attendance Portal first.</div>`}`;
  }
  $('#content').innerHTML = `
    <div class="card card-pad filters" style="margin-bottom:14px; display:flex; gap:12px; align-items:end; flex-wrap:wrap;">
      <label style="font-size:12px;">Payroll month<br><input type="month" id="pyMonth" value="${PAYROLL.month}"></label>
      <button class="btn btn-primary btn-sm" id="pyFetch">Fetch totals from Payroll/Attendance Portal</button>
    </div>${body}`;
  $('#pyMonth').onchange = e=>{ PAYROLL.month=e.target.value; PAYROLL.data=null; PAYROLL.error=''; };
  $('#pyFetch').onclick = async ()=>{
    if(!PAYROLL.month) return toast('Choose a month first.','error');
    PAYROLL.loading=true; PAYROLL.error=''; PAYROLL.data=null; renderPayroll();
    try{
      const r = await fetch('/api/payroll/fetch',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({month:PAYROLL.month})});
      const j = await r.json().catch(()=>({}));
      if(!r.ok || j.ok===false) PAYROLL.error = j.error || 'Could not fetch payroll totals.'; else PAYROLL.data = j;
    }catch(e){ PAYROLL.error='Could not reach the server. Please try again.'; }
    PAYROLL.loading=false; renderPayroll();
  };
  const rec = $('#pyRecord');
  if(rec) rec.onclick = async ()=>{
    const salCat2 = S.categories.find(c=>c.kind==='expense' && c.name==='Salaries'); if(!salCat2) return;
    const picked = $$('.pyChk').filter(c=>c.checked).map(c=>+c.dataset.i);
    if(!picked.length) return toast('Select at least one department.','error');
    const account = $('#pyAcc').value, date = $('#pyDate').value; if(!account||!date) return toast('Choose the account and date.','error');
    rec.disabled = true; rec.textContent = 'Recording…'; let n=0;
    try{
      for(const i of picked){
        const r = PAYROLL.data.departments[i]; const reference = payrollRef(PAYROLL.data.month, r.name);
        if(S.transactions.find(t=>t.reference===reference && t.status!=='voided')) continue;
        const bu = ($$('.pyBu').find(s=>+s.dataset.i===i)||{}).value || null;
        const voucher = await nextVoucher('expense'); const id = uuid();
        await dbSet('transactions', id, {
          voucher, type:'expense', date, amount:Number(r.net), currency:'BDT', accountId:account, toAccountId:null,
          categoryId:salCat2.id, businessUnitId:bu, party:'Payroll — '+r.name, reference,
          description:`Salaries for ${payrollMonthLabel(PAYROLL.data.month)} — ${r.name} (${r.employees} employee${r.employees===1?'':'s'}). Imported from the Payroll/Attendance Portal.`,
          status:'recorded', createdBy:S.uid, createdByName:S.me.name, createdAt:new Date().toISOString(), source:'salary-portal',
        });
        await logAudit('TRANSACTION_CREATED','transaction', id, `${voucher} — payroll import ${payrollMonthLabel(PAYROLL.data.month)} / ${r.name}: ${money(r.net)}`);
        await refetchAll(); n++;
      }
      toast(n? `${n} salary expense${n===1?'':'s'} recorded.` : 'Nothing new to record.', 'success');
    }catch(e){ console.error(e); toast('Could not record some entries. Check the Transactions list before trying again.','error'); }
    renderPayroll();
  };
}

function renderAccounts(){
  setTitle('Cash & Bank Accounts', 'Every account Connectivo holds funds in');
  let rows = FinancialService.balances(S.accounts, S.transactions, null, null);
  const f = S.accountFilters;
  if(f.type) rows = rows.filter(r=>r.account.type===f.type);
  if(f.q) rows = rows.filter(r=>r.account.name.toLowerCase().includes(f.q.toLowerCase()));
  const totalClosing = rows.reduce((s,r)=>s+r.closing,0);

  $('#content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
      <div class="filters">
        <input id="facctq" placeholder="Search accounts…" value="${esc(f.q)}" style="width:180px;">
        <select id="facctType"><option value="">All types</option><option value="cash" ${f.type==='cash'?'selected':''}>Cash</option><option value="bank" ${f.type==='bank'?'selected':''}>Bank</option></select>
      </div>
      <button class="btn btn-primary btn-sm" id="addAcc">${ICONS('plus')} Add Account</button>
    </div>

/** Resolves the currently-selected report period, including "Custom
 * Range" — the one option every report page was missing before, even
 * though the Transactions tabs already had free-form from/to dates. */
/** PDF headers show the actual resolved period ("September 2026") rather
 * than a generic preset name ("This Month") — concrete and unambiguous
 * once a document is actually generated and might be read later. Falls
 * back to the preset label only when there's genuinely no date to show
 * (e.g. "All Time"). */
function concretePeriodLabel(per){
  if(!per.from && !per.to) return per.label || 'All Time';
  if(!per.from || !per.to) return per.label;
  const fromD = new Date(per.from+'T00:00:00'), toD = new Date(per.to+'T00:00:00');
  const sameMonth = fromD.getFullYear()===toD.getFullYear() && fromD.getMonth()===toD.getMonth();
  if(sameMonth) return fromD.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  return `${fmtDate(per.from)} – ${fmtDate(per.to)}`;
}
function resolveReportPeriod(){
  if(S.reportPeriod==='all') return {from:null, to:null, label:'All Time'};
  if(S.reportPeriod==='custom'){
    const from = S.reportCustomFrom||null, to = S.reportCustomTo||null;
    const label = (from && to) ? `${fmtDate(from)} – ${fmtDate(to)}` : 'Custom Range (pick both dates)';
    return {from, to, label};
  }
  return periodRange(S.reportPeriod);
}
function reportPeriodControls(){

/** Applies the shared report filters to a transaction list before any
 * period/date filtering — every report's underlying data should reflect
 * "just this category/unit/account/search" the same way. */
function applyReportFilters(list){
  const f = S.reportFilters;
  return list.filter(t=>{
    if(f.category && t.categoryId!==f.category) return false;
    if(f.bu && t.businessUnitId!==f.bu) return false;
    if(f.account && t.accountId!==f.account && t.toAccountId!==f.account) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = [t.party, t.description, t.reference, t.voucher].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/** Sums a cashbook side (Debit/Received or Credit/Payment) split by
 * account type, using the EXACT same "which column does this land in"
 * logic the table rows use — so the footer total always matches what the
 * Cash and Bank columns visually add up to, rather than a separate
 * blended figure that can look like it's silently just one of the two. */
function cashBankSums(list, isReceipt){
  let cash=0, bank=0;
  list.forEach(t=>{
    if(t.type==='transfer'){
      const acc = S.accounts.find(a=>a.id===t.accountId), toAcc = S.accounts.find(a=>a.id===t.toAccountId);
      const relevant = isReceipt? toAcc : acc;
      if(relevant && relevant.type==='cash') cash += Number(t.amount||0);
      if(relevant && relevant.type==='bank') bank += Number(t.amount||0);
    } else {
      const acc = S.accounts.find(a=>a.id===t.accountId);
      if(acc && acc.type==='cash') cash += Number(t.amount||0);
      if(acc && acc.type==='bank') bank += Number(t.amount||0);
    }
  });
  return {cash, bank, total: cash+bank};
}

/** Traditional daily cash-book closing: each day with activity gets a
 * Balance B/D (brought down — the running balance at the start of that
 * day) and a Balance C/D (carried down — the balance at day's end, which
 * becomes the next active day's B/D). Combines Cash + Bank into one
 * running total; transfers between Connectivo's own accounts are left
 * out of Receipts/Payments since they net to zero on the combined
 * balance, same reasoning as the Cash Flow Statement. */
function computeDailyBalances(){
  const per = resolveReportPeriod();
  const base = applyReportFilters(S.transactions).filter(t=>t.status!=='voided');
  const bal = FinancialService.balances(S.accounts, base, per.from, per.to);
  const openingOverall = bal.reduce((s,r)=>s+r.opening,0);
  const inRange = t => (!per.from||t.date>=per.from) && (!per.to||t.date<=per.to);
  const activity = base.filter(t=>inRange(t) && (t.type==='income'||t.type==='expense'));
  const byDate = {};
  activity.forEach(t=>{ (byDate[t.date]=byDate[t.date]||[]).push(t); });
  const dates = Object.keys(byDate).sort();
  let running = openingOverall;
  const rows = dates.map(date=>{
    const receipts = byDate[date].filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0);
    const payments = byDate[date].filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0);
    const bd = running;
    const cd = bd + receipts - payments;
    running = cd;
    return {date, bd, receipts, payments, cd};
  });
  return {rows, openingOverall, closingOverall: running};
}
function dailyBalanceTableHtml(){
  const { rows, openingOverall } = computeDailyBalances();
  if(!rows.length) return `<div class="card card-pad" style="margin-top:14px;">${emptyInline('No daily activity in this period to balance.')}</div>`;
  return `
    <div class="card" style="margin-top:14px;">
      <div class="card-head"><div class="card-title">Daily Balance — Balance B/D → Balance C/D</div></div>
      <div class="card-pad viewport-narrow">
        <table><thead><tr><th>Date</th><th class="right">Balance B/D (BDT)</th><th class="right">Receipts (BDT)</th><th class="right">Payments (BDT)</th><th class="right">Balance C/D (BDT)</th></tr></thead>
        <tbody>
          <tr style="cursor:default; color:var(--ink-faint);"><td colspan="4">Opening balance (start of period)</td><td class="right mono-amt">${money(openingOverall)}</td></tr>
          ${rows.map(r=>`<tr style="cursor:default;"><td>${fmtDate(r.date)}</td><td class="right mono-amt">${money(r.bd)}</td><td class="right mono-amt" style="color:var(--success)">${r.receipts?money(r.receipts):'—'}</td><td class="right mono-amt" style="color:var(--danger)">${r.payments?money(r.payments):'—'}</td><td class="right mono-amt" style="font-weight:700;">${money(r.cd)}</td></tr>`).join('')}
        </tbody></table>
      </div>
      <p style="font-size:11.5px; color:var(--ink-faint); padding:0 20px 14px;">Balance C/D on one day becomes Balance B/D the next — the standard "carried down / brought down" running balance, combining Cash and Bank. Transfers between Connectivo's own accounts aren't shown as Receipts or Payments here since they don't change the combined total.</p>
    </div>`;
}

async function downloadProfitLossPdf(){
  const per = resolveReportPeriod();
  const base = applyReportFilters(S.transactions);
  const revByCat = FinancialService.byCategory(base, S.categories, 'income', per.from, per.to);
  const expByCat = FinancialService.byCategory(base, S.categories, 'expense', per.from, per.to);
  const totalRevenue = revByCat.reduce((s,r)=>s+r.amount,0);
  const totalExpense = expByCat.reduce((s,r)=>s+r.amount,0);
  const netProfit = totalRevenue - totalExpense;

  const doc = PDF.new();
  let y = PDF.header(doc, 'Profit & Loss Statement', concretePeriodLabel(per));
  const cols = [{label:'Line Item',width:100},{label:'Amount (BDT)',width:41,align:'right'},{label:'% of Total',width:41,align:'right'}];
  const revRows = revByCat.map(r=>['  '+r.name, money(r.amount), totalRevenue>0?((r.amount/totalRevenue)*100).toFixed(1)+'%':'0.0%']);
  revRows.push(['Total Revenue', money(totalRevenue), '']);
  y = PDF.table(doc, {title:'Revenue', startY:y, columns:cols, rows:revRows, boldLast:true});
  y += 6;
  if(y > PDF.H - 70){ PDF.footer(doc, doc.internal.getNumberOfPages()); doc.addPage(); y = PDF.header(doc,'Profit & Loss Statement', concretePeriodLabel(per)); }
  const expRows = expByCat.map(r=>['  '+r.name, money(r.amount), totalExpense>0?((r.amount/totalExpense)*100).toFixed(1)+'%':'0.0%']);
  expRows.push(['Total Expenses', money(totalExpense), '']);
  y = PDF.table(doc, {title:'Expenses', startY:y, columns:cols, rows:expRows, boldLast:true});
  y += 6;
  if(y > PDF.H - 30){ PDF.footer(doc, doc.internal.getNumberOfPages()); doc.addPage(); y = PDF.header(doc,'Profit & Loss Statement', concretePeriodLabel(per)); }
  doc.setDrawColor(21,27,35); doc.setLineWidth(0.6); doc.line(PDF.margin, y, PDF.W-PDF.margin, y); y += 7;
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text(`Net ${netProfit>=0?'Profit':'Loss'}`, PDF.margin, y);
  doc.text(signedMoney(netProfit), PDF.W-PDF.margin, y, {align:'right'});
  finalizePdf(doc);
  await PDF.download(doc, `connectivo-profit-loss-${todayISO()}.pdf`);
}

/* ================= JOURNAL ================= */
/** This app doesn't store true double-entry debit/credit pairs — each
 * transaction just has a type, an account, and (for income/expense) a
 * category. This derives the standard double-entry view from that:
 * income debits the receiving account and credits the revenue category;
 * expenses debit the expense category and credit the paying account;
 * transfers debit the receiving account and credit the paying one. */
/** Debit/Credit columns show the AMOUNT on whichever side the entry
 * belongs to (and 0.00 on the other) rather than an account or category
 * name — income debits (cash/bank increases), expense credits (cash/bank
 * decreases), and a transfer genuinely debits the receiving account and
 * credits the paying one by the same amount, so both columns get it. */
function journalEntryFor(t){
  const cat = S.categories.find(c=>c.id===t.categoryId);
  const amt = Number(t.amount||0);
  if(t.type==='income') return {debitAmount: amt, creditAmount: 0, particulars: t.party||(cat?cat.name:'Income')};
  if(t.type==='expense') return {debitAmount: 0, creditAmount: amt, particulars: t.party||(cat?cat.name:'Expense')};
  const acc = S.accounts.find(a=>a.id===t.accountId);
  const toAcc = S.accounts.find(a=>a.id===t.toAccountId);
  return {debitAmount: amt, creditAmount: amt, particulars: `Transfer: ${acc?acc.name:''} → ${toAcc?toAcc.name:''}`};
}
/** Journal order: oldest first by transaction date, then by the time the entry was recorded, then voucher no. */
function journalOrder(a,b){ return String(a.date).localeCompare(String(b.date)) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')) || String(a.voucher).localeCompare(String(b.voucher)); }
function renderJournal(){
  setTitle('Journal', 'Every transaction, chronologically, as a double-entry journal');
  const per = resolveReportPeriod();
  const inRange = t=> (!per.from||t.date>=per.from) && (!per.to||t.date<=per.to) && t.status!=='voided';
  const base = applyReportFilters(S.transactions);
  const entries = base.filter(inRange).sort(journalOrder);
  const totalAmount = entries.reduce((s,t)=>s+Number(t.amount||0),0);

  $('#content').innerHTML = `
    <div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div class="filters">${reportPeriodControls()}${reportFilterControlsHtml(null)}</div>
      <button class="btn btn-ghost btn-sm" id="pdfBtn">${ICONS('download')} Download PDF</button>
    </div>
    <div class="card">
      <div class="card-pad viewport-narrow" style="padding-top:6px;">
        ${entries.length? `<table><thead><tr><th>Date</th><th>Voucher</th><th>Particulars</th><th class="right">Debit Account (BDT)</th><th class="right">Credit Account (BDT)</th><th class="right">Amount (BDT)</th></tr></thead><tbody>
          ${entries.map(t=>{ const e = journalEntryFor(t); return `<tr data-tx="${t.id}">
            <td>${fmtDate(t.date)}</td><td style="font-weight:600;">${esc(t.voucher)}</td><td>${esc(e.particulars)}</td>
            <td class="right mono-amt">${money(e.debitAmount)}</td><td class="right mono-amt">${money(e.creditAmount)}</td><td class="right mono-amt">${money(t.amount)}</td>
          </tr>`; }).join('')}
        </tbody></table>` : emptyInline('No transactions in this period.')}
      </div>
    </div>
    ${entries.length? `<div class="card card-pad" style="margin-top:12px; display:flex; gap:10px; align-items:baseline;">
      <span style="font-size:11.5px; color:var(--ink-soft); font-weight:600;">Total (BDT) across ${entries.length} entr${entries.length!==1?'ies':'y'}</span>
      <span class="mono-amt" style="font-size:16px; font-weight:800;">${money(totalAmount)}</span>
    </div>` : ''}
  `;
  bindReportPeriodControls(renderJournal);
  bindReportFilterControls(renderJournal);
  $$('[data-tx]').forEach(row=> row.onclick = ()=> openTxDetail(row.dataset.tx));
  $('#pdfBtn').onclick = async e=>{ e.target.disabled=true; const orig=e.target.innerHTML; e.target.textContent='Generating…'; try{ await downloadJournalPdf(); }catch(err){ toast('Unable to generate the PDF.','error'); } finally{ e.target.disabled=false; e.target.innerHTML=orig; } };
}

async function downloadJournalPdf(){
  const per = resolveReportPeriod();
  const inRange = t=> (!per.from||t.date>=per.from) && (!per.to||t.date<=per.to) && t.status!=='voided';
  const base = applyReportFilters(S.transactions);
  const entries = base.filter(inRange).sort(journalOrder);
  const doc = PDF.new();
  let y = PDF.header(doc, 'Journal', concretePeriodLabel(per));
  PDF.table(doc, {
    startY:y,
    columns:[{label:'Date',width:19},{label:'Voucher',width:27},{label:'Particulars',width:52},{label:'Debit (BDT)',width:29,align:'right'},{label:'Credit (BDT)',width:29,align:'right'},{label:'Amount (BDT)',width:26,align:'right'}],
    rows: entries.map(t=>{ const e = journalEntryFor(t); return [fmtDateCompact(t.date), t.voucher, e.particulars, money(e.debitAmount), money(e.creditAmount), money(t.amount)]; }),
  });
  finalizePdf(doc);
  await PDF.download(doc, `connectivo-journal-${todayISO()}.pdf`);
}

      <div class="card-pad viewport-narrow" style="padding-top:14px;">

async function downloadCashFlowPdf(){
  const per = resolveReportPeriod();
  const base = applyReportFilters(S.transactions);
  const bal = FinancialService.balances(S.accounts, base, per.from, per.to);
  const openingCash = bal.reduce((s,r)=>s+r.opening,0);
  const closingCash = bal.reduce((s,r)=>s+r.closing,0);
  const cashIn = bal.reduce((s,r)=>s+r.income,0);
  const cashOut = bal.reduce((s,r)=>s+r.expense,0);
  const netChange = cashIn - cashOut;

  const doc = PDF.new();
  let y = PDF.header(doc, 'Cash Flow Statement (BDT)', concretePeriodLabel(per));
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const rows = [
    ['Opening Cash & Bank Balance', money(openingCash), true],
    ['Cash received (income)', money(cashIn), false],
    ['Cash paid (expenditure)', '−'+money(cashOut), false],
    ['Net Change in Cash', signedMoney(netChange), true],
    ['Closing Cash & Bank Balance', money(closingCash), true],
  ];
  rows.forEach(([k,v,bold])=>{
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.text(k, PDF.margin, y);
    doc.text(v, PDF.W-PDF.margin, y, {align:'right'});
    y += 7.5;
  });
  y += 4;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(87,97,109);
  doc.text("Transfers between Connectivo's own accounts aren't counted as an inflow or outflow — they move cash between Cash and Bank but don't change the total.", PDF.margin, y, {maxWidth: PDF.W-2*PDF.margin});
  finalizePdf(doc);
  await PDF.download(doc, `connectivo-cash-flow-${todayISO()}.pdf`);
}

async function downloadBalanceSheetPdf(){
  const asOf = S.balanceSheetDate || todayISO();
  const bal = FinancialService.balances(S.accounts, S.transactions, null, asOf);
  const totalAssets = bal.reduce((s,r)=>s+r.closing,0);
  const totalLiabilities = 0;
  const equity = totalAssets - totalLiabilities;

  const doc = PDF.new();
  let y = PDF.header(doc, 'Balance Sheet', `As of ${fmtDate(asOf)}`);
  y = PDF.table(doc, {
    title:'Assets (BDT)', startY:y,
    columns:[{label:'Account',width:130},{label:'Amount (BDT)',width:52,align:'right'}],
    rows: [...bal.map(r=>[r.account.name, money(r.closing)]), ['Total Assets', money(totalAssets)]],
  });
  y += 6;
  y = PDF.table(doc, {
    title:'Liabilities & Equity (BDT)', startY:y,
    columns:[{label:'Item',width:130},{label:'Amount (BDT)',width:52,align:'right'}],
    rows: [['Liabilities (not tracked)', money(totalLiabilities)], ['Retained Earnings', money(equity)], ['Total Liabilities & Equity', money(totalLiabilities+equity)]],
  });
  y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(87,97,109);
  doc.text("This system tracks Cash & Bank only, not liabilities or non-cash assets. This statement assumes none exist beyond what's recorded here.", PDF.margin, y, {maxWidth: PDF.W-2*PDF.margin});
  finalizePdf(doc);
  await PDF.download(doc, `connectivo-balance-sheet-${todayISO()}.pdf`);
}

        <div class="permgrp">Pages they can open <span style="text-transform:none; letter-spacing:0; font-weight:500;">· <a href="#" id="nuAll">select all</a> · <a href="#" id="nuNone">clear</a></span></div>

    };

      showModal(userForm(u));
      $('#nuAll').onclick = e=>{ e.preventDefault(); $$('.nuPg').forEach(c=>c.checked=true); };
      $('#nuNone').onclick = e=>{ e.preventDefault(); $$('.nuPg').forEach(c=>c.checked=false); };
      $('#nuSave').onclick = async ()=>{

          action: u?'update':'create', uid: u&&u.uid,
          name: $('#nuName').value.trim(), username: $('#nuUser').value.trim(),
          pages: $$('.nuPg').filter(c=>c.checked).map(c=>c.value),

          await logAudit(u?'USER_UPDATED':'USER_CREATED','user', u?u.uid:d.uid, `${body.name} (${body.edit?'can edit':'view only'}, ${body.pages.length} pages)`);

    $$('[data-edituser]').forEach(b=> b.onclick = ()=> openUserForm(others.find(a=>a.uid===b.dataset.edituser)));

      const next = current==='suspended' ? 'active' : 'suspended';
      try{
        const existing = await dbGetDoc('roles', uid);
        if(existing) await dbUpdate('roles', uid, {status:next});
        else await dbSet('roles', uid, {name:acct.name, role:acct.role, status:next, addedAt:new Date().toISOString()});

      $('#tgOk').onclick = ()=>{ closeModal(); doTog(b); };
    });
  };

  if(S.mode==='server'){
    $('#content').innerHTML = `<div class="card card-pad">${emptyInline('Loading accounts…')}</div>`;
    fetchAccountsList().then(list=>{
      const others = (list || ACCOUNTS).filter(a=>a.uid!==S.uid);
      renderTable(others);
    });
  } else {
    renderTable(ACCOUNTS.filter(a=>a.uid!==S.uid));
  }
}

          ${S.auditLogs.map(l=>`<tr style="cursor:default;"><td style="white-space:nowrap;">${fmtDateTime(l.at)}</td><td>${esc(l.userName)}</td><td>${esc(l.action)}</td><td>${esc(l.summary)}</td></tr>`).join('')}

      <div class="card-pad">
        <p style="font-size:12.5px; color:var(--ink-soft); margin-top:0;">Developer-only, permanent, and bypasses the void-not-delete rule that protects every other role. Nothing here can be undone.</p>
        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;">
          ${Object.entries(DEV_COLLECTION_LABELS).map(([key,label])=>`<button class="btn btn-ghost btn-sm" data-clear="${key}" style="color:var(--danger); border-color:#EFC9C4;">Clear ${esc(label)}</button>`).join('')}

      title:`Clear ${label}`,
      message:`This permanently deletes every record in <strong>${esc(label)}</strong>. This cannot be undone.`,
      confirmPhrase: 'CLEAR ' + label.toUpperCase(),
      confirmLabel: `Clear ${label}`,
      onConfirm: async ()=>{
        await clearCollection(key);
        await logAudit('COLLECTION_CLEARED','system','', `${label} cleared.`, auditActorLabel());
        toast(`${label} cleared.`, 'success');
        await refetchAll(); renderRoute();
      },
    });
  });
  $('#factoryResetBtn').onclick = ()=> openDangerConfirm({
    title:'Factory reset',
    message:'This permanently deletes <strong>all data</strong> — every transaction, account, category, business unit, document and audit entry — then recreates the default categories, accounts and business units from scratch.',
    confirmPhrase:'FACTORY RESET',
    confirmLabel:'Factory Reset',
    onConfirm: async ()=>{
      for(const key of Object.keys(DEV_COLLECTION_LABELS)){ await clearCollection(key); }
      await refetchAll();
      await seedIfEmpty();
      await logAudit('SYSTEM_FACTORY_RESET','system','', 'Factory reset performed.', auditActorLabel());
      toast('Factory reset complete.', 'success');
      await refetchAll(); renderRoute();
    },
  });
}
const DEV_COLLECTION_LABELS = {

/* ================= BRANDED PDF GENERATION ================= */
// jsPDF is loaded from cdnjs (see <head>). All PDFs share one branded
// header/footer so every statement, report and voucher looks like the
// same official Connectivo document, per the spec's PDF design rules.
const PDF = {
  W: 210, H: 297, margin: 14, // A4 portrait defaults, mm — landscape docs read their real size from jsPDF itself (see dims()) rather than these
  new(orientation){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4', orientation: orientation==='landscape'?'landscape':'portrait'});
    // jsPDF's built-in fonts only cover Latin-1 plus a few punctuation marks.
    // Any other character (an arrow, a true minus sign, ≥ ...) makes jsPDF fall
    // back to a 16-bit encoding that prints as garbled, widely spaced text —
    // the whole string, not just that one character. So unsupported characters
    // are swapped for safe equivalents before they ever reach the PDF.
    const MAP = {'→':'->','←':'<-','↔':'<->','−':'-','–':'-','‐':'-','‑':'-','≥':'>=','≤':'<=','≠':'!=','×':'x','’':"'",'‘':"'",'“':'"','”':'"','•':'-'};
    const safe = v => typeof v==='string' ? v.replace(/[^\x20-\x7E\xA0-\xFF]/g, ch => MAP[ch] || ((ch==='—'||ch==='…') ? ch : '?')) : v;
    const _text = doc.text.bind(doc), _width = doc.getTextWidth.bind(doc);
    doc.text = (t, ...rest)=> _text(Array.isArray(t) ? t.map(safe) : safe(t), ...rest);
    doc.getTextWidth = t => _width(safe(t));
    return doc;
  },
  /** Reads the ACTUAL page size from the document itself (jsPDF tracks
   * this correctly per-orientation) rather than assuming portrait — this
   * is what lets header/footer/table work unmodified on a landscape doc. */
  dims(doc){
    return { W: doc.internal.pageSize.getWidth(), H: doc.internal.pageSize.getHeight() };
  },
  header(doc, title, subtitle){
    const m = this.margin;
    const { W } = this.dims(doc);
    if(!doc._rt) doc._rt = {title, subtitle};   // first header = the report's real title; reused on continuation pages
    // Logo's true aspect ratio is ~1.98:1 (686x346 after cropping its
    // transparent padding) — the previous 46x12.2 box distorted it badly
    // (squished ~3.8:1), which is why the PDF logo looked "fabricated".
    try{ doc.addImage(window.__LOGO_FULL__, 'PNG', m, 9, 34, 17.15, 'cnv-logo', 'FAST'); }catch(e){}
    doc.setTextColor(21,27,35);
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text(title, W-m, 15, {align:'right'});
    // The period/subtitle is bold now — this is the actual resolved
    // period ("September 2026"), not a generic preset name, so it reads
    // correctly even if the PDF is opened later ("This Month" would then
    // be misleading). "Generated / Prepared by" moved to the footer —
    // see footer() below — since it's provenance info, not headline info.
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    if(subtitle) doc.text(subtitle, W-m, 21, {align:'right'});
    doc.setDrawColor(226,231,236); doc.setLineWidth(0.4);
    doc.line(m, 27, W-m, 27);
    doc.setTextColor(21,27,35);
    return 35; // next content Y
  },
  footer(doc, pageNum, totalPages){
    if(!totalPages) return; // only finalizePdf() stamps footers, once per page, with the true "of N"
    const m = this.margin;
    const { W, H } = this.dims(doc);
    doc.setDrawColor(226,231,236); doc.line(m, H-18, W-m, H-18);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(137,147,160);
    // "Generated / Prepared by" lives here now, not in the header — it's
    // provenance information for whoever reads the document later, not
    // part of the document's actual headline content.
    doc.text(`Generated ${fmtDateTime(new Date().toISOString())} · Prepared by ${S.me.name||'—'}`, m, H-13);
    doc.setFontSize(8);
    doc.text('Confidential — Connectivo Internal Financial Record', m, H-8);
    doc.text(`Page ${pageNum}${totalPages?(' of '+totalPages):''}`, W-m, H-8, {align:'right'});
  },
  /** Draws a simple bordered table starting at startY, paginating with the
   * same branded header/footer when content runs past the page. Returns
   * the Y position after the table. */
  /** jsPDF's `text()` with `maxWidth` silently WRAPS onto a second line
   * when content doesn't fit — but every row here is drawn at a fixed
   * height, so that second line bled straight into the row below it
   * (this was the "Date"/"Head of Account" overlap bug). Truncating with
   * an ellipsis instead guarantees every cell stays single-line. */
  truncateToFit(doc, text, maxWidth){
    if(doc.getTextWidth(text) <= maxWidth) return text;
    let s = text;
    while(s.length > 0 && doc.getTextWidth(s+'…') > maxWidth){ s = s.slice(0,-1); }
    return s.length ? s+'…' : '…';
  },
  /** Word-wraps text into lines that each fit maxW (breaking an over-long word
   * by characters if it must), capped at maxLines with an ellipsis on the last
   * line — so long entries show in full across a few lines instead of being
   * cut off. Measures with the font/size currently set on `doc`. */
  wrapLines(doc, text, maxW, maxLines){
    const out = []; let line = '';
    const push = ()=>{ out.push(line); line = ''; };
    const words = String(text).split(/\s+/).filter(Boolean);
    if(!words.length) return [''];
    for(let w of words){
      while(doc.getTextWidth(w) > maxW && w.length > 1){
        let k = w.length; while(k > 1 && doc.getTextWidth(w.slice(0,k)) > maxW) k--;
        if(line) push();
        line = w.slice(0,k); w = w.slice(k); push();
      }
      if(!w) continue;
      const test = line ? line+' '+w : w;
      if(doc.getTextWidth(test) <= maxW) line = test; else { if(line) push(); line = w; }
    }
    if(line) push();
    if(out.length > maxLines){
      const kept = out.slice(0, maxLines);
      kept[maxLines-1] = this.truncateToFit(doc, kept[maxLines-1]+' '+out.slice(maxLines).join(' '), maxW);
      return kept;
    }
    return out;
  },
  /** xStart lets two tables be drawn side by side at the same startY
   * (used by the cashbook's Debit/Credit layout) — defaults to the page
   * margin for a normal full-width table. The table's drawn width is
   * always the sum of its own column widths, not the full page, so a
   * half-width table's shading/divider correctly hug its own columns. */
  table(doc, {title, subtitle, startY, columns, rows, xStart, boldLast}){
    const m = this.margin;
    const x0 = typeof xStart==='number' ? xStart : m;
    const tw = columns.reduce((s,c)=>s+c.width,0);
    const { H } = this.dims(doc);
    const LIM = H - 22, LINE_H = 3.4, FS = 8.5;
    let y = startY;
    const rt = doc._rt || {title:title||'', subtitle:subtitle||''};
    // Keep a section heading + its header row + at least two rows together
    // (never a lone heading/header stranded at the bottom of a page).
    const headBlock = (title?5:0) + (subtitle?6:0) + 7 + 13;
    if(y + headBlock > LIM && y > 40){ doc.addPage(); y = this.header(doc, rt.title, rt.subtitle); }
    const drawHeaderRow = ()=>{
      doc.setFillColor(10,61,92); doc.setTextColor(255,255,255);
      doc.rect(x0, y, tw, 7, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
      let x = x0+2;
      columns.forEach(c=>{
        const label = this.truncateToFit(doc, c.label, c.width-4);
        doc.text(label, x + (c.align==='right'? c.width-4:0), y+4.8, {align:c.align==='right'?'right':'left'});
        x += c.width;
      });
      doc.setTextColor(21,27,35);
      y += 7;
    };
    if(title){ doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(title, x0, y); y += 5; }
    if(subtitle){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(87,97,109); doc.text(subtitle, x0, y); doc.setTextColor(21,27,35); y += 6; }
    drawHeaderRow();
    doc.setFont('helvetica','normal'); doc.setFontSize(FS);
    // Text cells wrap (up to 3 lines) so long names/particulars are readable, not cut.
    const cellLines = (c, raw, bold)=>{
      doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(FS);
      return this.wrapLines(doc, raw, c.width-4, 3);
    };
    rows.forEach((row, i)=>{
      const bold = !!(boldLast && i===rows.length-1);
      let n = 1;
      const cells = columns.map((c,ci)=>{
        const raw = String(row[ci] ?? '');
        if(c.align==='right') return null;
        const ls = cellLines(c, raw, bold); n = Math.max(n, ls.length); return ls;
      });
      const rh = 6.4 + (n-1)*LINE_H;
      if(y + rh > LIM){
        doc.addPage();
        y = this.header(doc, rt.title, rt.subtitle);
        if(title){ doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(21,27,35); doc.text(title+' (continued)', x0, y); y += 5; }
        drawHeaderRow();
      }
      if(bold){ doc.setFillColor(243,246,249); doc.rect(x0, y, tw, rh, 'F'); }
      else if(i%2===1){ doc.setFillColor(250,251,252); doc.rect(x0, y, tw, rh, 'F'); }
      doc.setFont('helvetica', bold?'bold':'normal'); doc.setTextColor(21,27,35); doc.setFontSize(FS);
      let x = x0+2;
      columns.forEach((c,ci)=>{
        const raw = String(row[ci] ?? '');
        if(c.align==='right'){
          // Money is never ellipsis-truncated (a shortened number reads as a
          // wrong number) — the font shrinks just enough to fit instead.
          let fz = FS;
          while(fz > 4.5 && doc.getTextWidth(raw) > c.width-4){ fz -= 0.5; doc.setFontSize(fz); }
          doc.text(raw, x+c.width-4, y+4.4, {align:'right'});
          if(fz !== FS) doc.setFontSize(FS);
        } else {
          cells[ci].forEach((ln,li)=> doc.text(ln, x, y+4.4+li*LINE_H, {align:'left'}));
        }
        x += c.width;
      });
      y += rh;
    });
    doc.setDrawColor(226,231,236); doc.setLineWidth(0.2); doc.line(x0, y, x0+tw, y);
    return y + 4;
  },
  /** Draws two tables side by side, row-for-row in lockstep, so their
   * page breaks stay synchronized (each side would otherwise paginate
   * independently and drift out of alignment). Returns the Y position
   * after both. */
  /** leftClosingRows/rightClosingRows: optional extra rows (e.g. "Balance
   * C/D", "Total") appended after the normal data rows — always bold, no
   * zebra shading, matching how a traditional cash book closes out each
   * side of the ledger. headerBg/headerText/grid let a caller match an
   * external template's exact color scheme (used by the Cash & Bank Book
   * specifically, to mirror Connectivo's own Excel cash book). */
  twinTable(doc, {leftTitle, rightTitle, leftRows, rightRows, leftClosingRows, rightClosingRows, columns, startY, gap, fontSize, headerBg, headerText, titleBg, titleText, grid}){
    const m = this.margin;
    const fs = fontSize || 8.5;
    const tw = columns.reduce((s,c)=>s+c.width,0);
    const g = typeof gap==='number' ? gap : 6;
    const xLeft = m, xRight = m + tw + g;
    const hBg = headerBg || [10,61,92], hText = headerText || [255,255,255];
    const tBg = titleBg || null, tText = titleText || [21,27,35];
    let y = startY;
    const cellBorder = (x0, yy, h)=>{
      if(!grid) return;
      doc.setDrawColor(205,212,220); doc.setLineWidth(0.15);
      let x = x0;
      columns.forEach(c=>{ doc.rect(x, yy, c.width, h, 'S'); x += c.width; });
    };
    const drawHeaders = ()=>{
      [[xLeft,leftTitle],[xRight,rightTitle]].forEach(([x0,title])=>{
        doc.setFillColor(hBg[0],hBg[1],hBg[2]); doc.setTextColor(hText[0],hText[1],hText[2]);
        doc.rect(x0, y, tw, 7, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(fs);
        let x = x0+2;
        // Same rule as data rows: right-aligned (money) column headers
        // are short labels, not figures, but staying consistent with
        // drawDataRow avoids the header truncating while its own data
        // below it doesn't — inconsistent-looking for no real reason.
        columns.forEach(c=>{ const label = c.align==='right' ? c.label : this.truncateToFit(doc,c.label,c.width-4); doc.text(label, x+(c.align==='right'?c.width-4:0), y+4.8, {align:c.align==='right'?'right':'left'}); x+=c.width; });
        cellBorder(x0, y, 7);
        doc.setTextColor(21,27,35);
      });
    };
    const drawTitleBand = (lt, rt)=>{
      if(tBg){
        [[xLeft,lt],[xRight,rt]].forEach(([x0,title])=>{
          doc.setFillColor(tBg[0],tBg[1],tBg[2]);
          doc.rect(x0, y, tw, 6, 'F');
          doc.setDrawColor(205,212,220); doc.setLineWidth(0.15); doc.rect(x0, y, tw, 6, 'S');
          doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(tText[0],tText[1],tText[2]);
          doc.text(title, x0+tw/2, y+4.2, {align:'center'});
        });
        doc.setTextColor(21,27,35);
        y += 6;
      } else {
        doc.setFont('helvetica','bold'); doc.setFontSize(11);
        doc.text(lt, xLeft, y); doc.text(rt, xRight, y);
        y += 5;
      }
    };
    // Long text wraps onto as many lines as it needs rather than being cut off;
    // both sides of a row share the taller height so they stay in lockstep.
    const LINE_H = 3.4;
    const wrapCell = (raw, maxW, bold)=>{
      doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(fs);
      return this.wrapLines(doc, raw, maxW, 99);
    };
    const rowHeight = (lr, rr, bold)=>{
      let n = 1;
      [lr, rr].forEach(row=>{ if(!row) return; columns.forEach((c,ci)=>{ if(c.align==='right') return; n = Math.max(n, wrapCell(String(row[ci] ?? ''), c.width-4, bold).length); }); });
      return 6.4 + (n-1)*LINE_H;
    };
    const drawDataRow = (x0, row, shaded, bold, h)=>{
      if(!row) return;
      if(bold){ doc.setFillColor(243,246,249); doc.rect(x0, y, tw, h, 'F'); }
      else if(shaded){ doc.setFillColor(250,251,252); doc.rect(x0, y, tw, h, 'F'); }
      doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(fs);
      let x = x0+2;
      columns.forEach((c,ci)=>{
        const raw = String(row[ci] ?? '');
        if(c.align==='right'){
          // Money never gets ellipsis-truncated (a shortened number reads
          // as a WRONG number) — shrink the font just enough to fit.
          let fz = fs;
          while(fz > 4.5 && doc.getTextWidth(raw) > c.width-4){ fz -= 0.5; doc.setFontSize(fz); }
          doc.text(raw, x+c.width-4, y+4.4, {align:'right'});
          if(fz !== fs) doc.setFontSize(fs);
        } else {
          wrapCell(raw, c.width-4, bold).forEach((ln,li)=> doc.text(ln, x, y+4.4+li*LINE_H, {align:'left'}));
        }
        x += c.width;
      });
      cellBorder(x0, y, h);
    };

    drawTitleBand(leftTitle, rightTitle);
    drawHeaders(); y += 7;
    const maxRows = Math.max(leftRows.length, rightRows.length);
    let pageNum = 1;
    for(let i=0; i<maxRows; i++){
      if(y + rowHeight(leftRows[i], rightRows[i], false) > this.dims(doc).H - 20){
        this.footer(doc, pageNum);
        doc.addPage(); pageNum++;
        y = this.header(doc, (doc._rt||{}).title||'Cash & Bank Book', (doc._rt||{}).subtitle||'');
        drawTitleBand(leftTitle+' (cont.)', rightTitle+' (cont.)');
        drawHeaders(); y += 7;
      }
      const rh = rowHeight(leftRows[i], rightRows[i], false);
      drawDataRow(xLeft, leftRows[i], i%2===1, false, rh);
      drawDataRow(xRight, rightRows[i], i%2===1, false, rh);
      y += rh;
    }
    // Closing rows (Sub total / Balance C/D / Total) — bold, own shading,
    // never zebra-striped against the data above.
    const maxClosing = Math.max((leftClosingRows||[]).length, (rightClosingRows||[]).length);
    for(let i=0; i<maxClosing; i++){
      if(y + rowHeight(leftClosingRows && leftClosingRows[i], rightClosingRows && rightClosingRows[i], true) > this.dims(doc).H - 20){
        this.footer(doc, pageNum);
        doc.addPage(); pageNum++;
        y = this.header(doc, (doc._rt||{}).title||'Cash & Bank Book', (doc._rt||{}).subtitle||'');
        drawTitleBand(leftTitle+' (cont.)', rightTitle+' (cont.)');
        drawHeaders(); y += 7;
      }
      const lc = leftClosingRows && leftClosingRows[i], rc = rightClosingRows && rightClosingRows[i];
      const rh = rowHeight(lc, rc, true);
      drawDataRow(xLeft, lc, false, true, rh);
      drawDataRow(xRight, rc, false, true, rh);
      y += rh;
    }
    doc.setDrawColor(21,27,35); doc.setLineWidth(0.3);
    doc.line(xLeft, y, xLeft+tw, y);
    doc.line(xRight, y, xRight+tw, y);
    doc.setLineWidth(0.4);
    return { y: y+4, xLeft, xRight, tw };
  },
  /** Solid pie chart (not a donut — triangulating a hole out of the
   * middle is real extra complexity that isn't worth the risk without a
   * live jsPDF to test against; a solid pie is just as legitimately a
   * "graphical figure" and far more certain to render correctly). Each
   * wedge is built from many thin triangles fanning out from the centre
   * — a standard, low-risk technique using only doc.triangle(), which
   * this file already relies on elsewhere. Verified the underlying
   * angle math tiles with zero gaps before wiring this in.
   * Returns the color actually used per item, for a matching legend. */
  pieChart(doc, cx, cy, items, radius, palette){
    const pal = palette || DONUT_PALETTE_RGB;
    const total = items.reduce((s,i)=>s+Math.max(0,i.amount),0);
    const used = [];
    if(total<=0){
      doc.setFillColor(226,231,236);
      doc.circle(cx, cy, radius, 'F');
      return used;
    }
    let angle = -Math.PI/2;
    items.forEach((item,i)=>{
      const amt = Math.max(0,item.amount);
      const frac = amt/total;
      const color = pal[i % pal.length];
      used.push(color);
      if(frac<=0) return;
      const startAngle = angle;
      const sweep = frac*Math.PI*2;
      angle += sweep;
      doc.setFillColor(color[0],color[1],color[2]); doc.setDrawColor(color[0],color[1],color[2]); doc.setLineWidth(0.15);
      const nSteps = Math.max(1, Math.ceil(sweep/(Math.PI/40)));
      for(let s=0;s<nSteps;s++){
        const a1 = startAngle + sweep*s/nSteps;
        const a2 = startAngle + sweep*(s+1)/nSteps;
        const x1 = cx+radius*Math.cos(a1), y1 = cy+radius*Math.sin(a1);
        const x2 = cx+radius*Math.cos(a2), y2 = cy+radius*Math.sin(a2);
        doc.triangle(cx, cy, x1, y1, x2, y2, 'FD');
      }
    });
    doc.setLineWidth(0.4); doc.setDrawColor(226,231,236);
    return used;
  },
  /** Pie chart + a text legend beside it (name, color swatch, %), the PDF
   * equivalent of the web app's donut-with-legend panels. Returns the Y
   * position after the taller of the two (chart vs legend). */
  pieWithLegend(doc, {x, y, items, radius, title}){
    // More than 8 slices is unreadable (and the legend only has room for 8):
    // keep the 7 largest and fold the rest into one "Other (n)" slice.
    items = items.filter(i=>i.amount>0);
    if(items.length > 8){
      const sorted = items.slice().sort((a,b)=>b.amount-a.amount);
      const rest = sorted.slice(7);
      items = sorted.slice(0,7).concat([{name:`Other (${rest.length})`, amount: rest.reduce((s,r)=>s+r.amount,0)}]);
    }
    const total = items.reduce((s,i)=>s+Math.max(0,i.amount),0);
    if(title){ doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(21,27,35); doc.text(title, x, y); y += 7; }
    const cx = x+radius, cy = y+radius;
    const colors = this.pieChart(doc, cx, cy, items, radius, DONUT_PALETTE_RGB);
    let ly = y + 1;
    const lx = x + radius*2 + 10;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    items.slice(0,8).forEach((item,i)=>{
      const pct = total>0 ? (Math.max(0,item.amount)/total*100).toFixed(1) : '0.0';
      const c = colors[i] || [180,180,180];
      doc.setFillColor(c[0],c[1],c[2]);
      doc.rect(lx, ly-2.6, 3, 3, 'F');
      doc.setTextColor(21,27,35);
      const label = this.truncateToFit(doc, item.name, 55);
      doc.text(`${label} — ${pct}%`, lx+5, ly);
      ly += 5.5;
    });
    return Math.max(y + radius*2 + 6, ly + 4);
  },
  /** Simple vertical bar chart (paired Income/Expense bars per month) —
   * the PDF equivalent of the Historical Analysis trend chart. */
  barChart(doc, {x, y, width, height, series, color1, color2}){
    const max = Math.max(1, ...series.map(s=>Math.max(s.income,s.expense)));
    const n = series.length;
    const slot = width / n;
    const barW = Math.min(slot*0.38, 6);
    doc.setDrawColor(226,231,236); doc.setLineWidth(0.2);
    for(let g=1; g<=3; g++){ const gy = y + height*(1-g/4); doc.line(x, gy, x+width, gy); }
    series.forEach((s,i)=>{
      const cx = x + slot*i + slot/2;
      const hInc = (s.income/max)*height, hExp = (s.expense/max)*height;
      doc.setFillColor(color1[0],color1[1],color1[2]);
      doc.rect(cx-barW-0.5, y+height-hInc, barW, hInc, 'F');
      doc.setFillColor(color2[0],color2[1],color2[2]);
      doc.rect(cx+0.5, y+height-hExp, barW, hExp, 'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(137,147,160);
      doc.text(monthLabel(s.ym).split(' ')[0], cx, y+height+4, {align:'center'});
    });
    doc.setDrawColor(21,27,35); doc.setLineWidth(0.2);
    doc.line(x, y+height, x+width, y+height);
    return y + height + 8;
  },
  async download(doc, filename){
    const blob = doc.output('blob');
    await triggerDownload(filename, blob);
  }
};

function finalizePdf(doc, title, subtitle, pageCountHint){
  // stamp footer with correct total page count across every page
  const total = doc.internal.getNumberOfPages();
  for(let p=1;p<=total;p++){ doc.setPage(p); PDF.footer(doc, p, total); }
}

async function downloadVoucherPdf(t){
  const doc = PDF.new();
  let y = PDF.header(doc, 'CONNECTIVO FINOPS', 'Financial Operations & Control');
  const cat = S.categories.find(c=>c.id===t.categoryId);
  const bu = S.businessUnits.find(b=>b.id===t.businessUnitId);

  const toAcc = S.accounts.find(a=>a.id===t.toAccountId);

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(kindLabel, PDF.margin, y+6);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(14,107,168);
  doc.text(t.voucher, PDF.margin, y+15);
  doc.setTextColor(21,27,35);
  y += 24;

  const rows = [
    ['Date', fmtDate(t.date)],
    ['Type', t.type.charAt(0).toUpperCase()+t.type.slice(1)],
    ['Amount (BDT)', money(t.amount)],
  ];
  if(t.type==='transfer'){ rows.push(['From Account', acc?acc.name:'—'], ['To Account', toAcc?toAcc.name:'—']); }
  else { rows.push(['Account', acc?acc.name:'—'], ['Category', cat?cat.name:'Uncategorized'], [t.type==='income'?'Source':'Payee', t.party||'—']); }
  if(bu) rows.push(['Business Unit', bu.name]);
  rows.push(['Reference No.', t.reference||'—'], ['Description', t.description||'—'], ['Status', t.status==='voided'?'VOIDED':'Recorded'], ['Recorded By', t.createdByName||'—'], ['Recorded At', fmtDateTime(t.createdAt)]);
  if(t.status==='voided') rows.push(['Void Reason', t.voidReason||'—'], ['Voided By', `${t.voidedByName||'—'} on ${fmtDateTime(t.voidedAt)}`]);

  doc.setFontSize(10);
  rows.forEach(([k,v])=>{
    doc.setFont('helvetica','bold'); doc.setTextColor(87,97,109); doc.text(k, PDF.margin, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(21,27,35);
    const vl = PDF.wrapLines(doc, String(v), PDF.W-PDF.margin-48-PDF.margin, 6);
    vl.forEach((ln,li)=> doc.text(ln, PDF.margin+48, y+li*4.6));
    y += 7 + (vl.length-1)*4.6;
  });

  y += 10;
  doc.setDrawColor(205,212,220);
  const sigW = (PDF.W-2*PDF.margin-16)/3;
  ['Prepared By','Reviewed By','Approved By'].forEach((label,i)=>{
    const x = PDF.margin + i*(sigW+8);
    doc.line(x, y, x+sigW, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(137,147,160);
    doc.text(label, x, y+4.5);
  });

  finalizePdf(doc);
  await PDF.download(doc, `${t.voucher}.pdf`);
}

/** One calculation of the Cash & Bank Book, used by BOTH the on-screen tab and
 * the PDF so the two can never drift apart again. Rows are
 * [Date, Head of A/C, Ref, Cash, Bank]; each row also carries .txId so the
 * screen can open the transaction when it's clicked. `arrow` is "->" for the
 * PDF (its built-in font has no arrow glyph) and "→" on screen. */
function buildCashbookModel(arrow){
  const per = resolveReportPeriod();
  const inRange = t=> (!per.from||t.date>=per.from) && (!per.to||t.date<=per.to) && t.status!=='voided';
  const base = applyReportFilters(S.transactions);
  const toRow = (t, isReceipt)=>{
    const cat = S.categories.find(c=>c.id===t.categoryId);
    const acc = S.accounts.find(a=>a.id===t.accountId), toAcc = S.accounts.find(a=>a.id===t.toAccountId);
    let head, cash='', bank='';
    if(t.type==='transfer'){
      head = `Transfer: ${acc?acc.name:''} ${arrow} ${toAcc?toAcc.name:''}`;
      const relevant = isReceipt? toAcc : acc;
      if(relevant && relevant.type==='cash') cash = money(t.amount);
      if(relevant && relevant.type==='bank') bank = money(t.amount);
    } else {
      head = t.party || (cat?cat.name:'—');
      if(acc && acc.type==='cash') cash = money(t.amount);
      if(acc && acc.type==='bank') bank = money(t.amount);
    }
    return Object.assign([fmtDateTight(t.date), head, t.reference||'—', cash, bank], {txId:t.id});
  };
  const receivedTxs = base.filter(t=>inRange(t) && (t.type==='income'||t.type==='transfer')).sort(journalOrder);
  const paidTxs = base.filter(t=>inRange(t) && (t.type==='expense'||t.type==='transfer')).sort(journalOrder);
  const received = receivedTxs.map(t=>toRow(t,true));
  const paid = paidTxs.map(t=>toRow(t,false));
  // Same cash-vs-bank split everywhere — matches exactly what the Cash and
  // Bank columns add up to.
  const recvSums = cashBankSums(receivedTxs, true);
  const paidSums = cashBankSums(paidTxs, false);

  // Balance B/D is literally the first Debit-side row; Sub total / Balance C/D
  // / Total close the Credit side so both sides foot to the same Total — the
  // standard way a physical cash book balances itself.
  const cashBal = FinancialService.balances(S.accounts.filter(a=>a.type==='cash'), base, per.from, per.to);
  const bankBal = FinancialService.balances(S.accounts.filter(a=>a.type==='bank'), base, per.from, per.to);
  const openingCash = cashBal.reduce((s,r)=>s+r.opening,0), openingBank = bankBal.reduce((s,r)=>s+r.opening,0);
  const closingCash = cashBal.reduce((s,r)=>s+r.closing,0), closingBank = bankBal.reduce((s,r)=>s+r.closing,0);
  const bdDateLabel = per.from ? fmtDateTight(per.from) : 'Opening';
  const leftClosing = [['', 'Total', '', money(openingCash+recvSums.cash), money(openingBank+recvSums.bank)]];
  const rightClosing = [
    ['', 'Sub total', '', money(paidSums.cash), money(paidSums.bank)],
    ['', 'Balance C/D', '', money(closingCash), money(closingBank)],
    ['', 'Total', '', money(paidSums.cash+closingCash), money(paidSums.bank+closingBank)],
  ];
  received.unshift(Object.assign([bdDateLabel, 'Balance B/D', '', money(openingCash), money(openingBank)], {txId:null}));
  return {per, received, paid, leftClosing, rightClosing, recvSums, paidSums};
}

async function downloadCashbookPdf(){
  const {per, received, paid, leftClosing, rightClosing, recvSums, paidSums} = buildCashbookModel('->');

  // Column set matches Connectivo's own Excel cash book exactly — Date,
  // Head of Account, Ref, then Cash/Bank (voucher numbers are left off; Head of A/C gets the room) — rather than the
  // Category column used elsewhere in this app. Landscape (not portrait)
  // gives enough width for Vc No. to show real voucher numbers like
  // "INC-2026-00002" without truncating.
  // Vc No. and Ref are sized to their longest actual value (just enough room
  // so nothing is cut off or wrapped); every millimetre saved goes to Head of
  // A/C, which is the column that gets long text.
  const measureDoc = PDF.new('landscape'); measureDoc.setFont('helvetica','normal'); measureDoc.setFontSize(7.5);
  const widest = ci => received.concat(paid).reduce((m,r)=> Math.max(m, measureDoc.getTextWidth(String(r[ci]==null?'':r[ci]))), 0);
  const fitW = (ci, min, max)=> Math.min(max||99, Math.max(min, Math.ceil((widest(ci)+4.6)*2)/2));
  const dateW = 15, moneyW = 20, refW = fitW(2, 10, 28);
  const headW = 131 - dateW - refW - 2*moneyW;
  const cols = [{label:'Date',width:dateW},{label:'Head of A/C',width:headW},{label:'Ref',width:refW},{label:'Cash (BDT)',width:moneyW,align:'right'},{label:'Bank (BDT)',width:moneyW,align:'right'}];

  // Excel color scheme from Connectivo's own cash book: light-blue header
  // band, dark-green bold header text, bordered grid.
  const XL_BG = [159,197,232], XL_TEXT = [0,97,0];

  const doc = PDF.new('landscape');
  let y = PDF.header(doc, 'Cash & Bank Book', concretePeriodLabel(per));
  const t = PDF.twinTable(doc, {
    leftTitle:'Dr.', rightTitle:'Cr.',
    leftRows:received, rightRows:paid, leftClosingRows:leftClosing, rightClosingRows:rightClosing,
    columns:cols, startY:y, gap:6, fontSize:7.5,
    headerBg:XL_BG, headerText:XL_TEXT, titleBg:XL_BG, titleText:XL_TEXT, grid:true,
  });
  y = t.y;
  if(y > PDF.dims(doc).H - 40){ PDF.footer(doc, doc.internal.getNumberOfPages()); doc.addPage(); y = PDF.header(doc, 'Cash & Bank Book', concretePeriodLabel(per)); }
  // Cash / Bank / Combined breakdown, explicitly labeled — not one
  // ambiguous "Total" figure that could be misread as just the bank side.
  const totalsBlock = (x0, label, sums)=>{
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.setTextColor(87,97,109); doc.text('Cash (BDT)', x0, y); doc.setTextColor(21,27,35); doc.text(money(sums.cash), x0+t.tw, y, {align:'right'});
    doc.setTextColor(87,97,109); doc.text('Bank (BDT)', x0, y+5); doc.setTextColor(21,27,35); doc.text(money(sums.bank), x0+t.tw, y+5, {align:'right'});
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
    doc.text(`${label} — Cash + Bank (BDT)`, x0, y+11);
    doc.text(money(sums.total), x0+t.tw, y+11, {align:'right'});
  };
  totalsBlock(t.xLeft, 'Total Received', recvSums);
  totalsBlock(t.xRight, 'Total Paid', paidSums);
  y += 28; // clear breathing room before the Daily Balance section

  finalizePdf(doc);
  await PDF.download(doc, `connectivo-cashbook-${todayISO()}.pdf`);
}

/* ================= DOCUMENTS (attachments) ================= */
async function uploadAttachment(file, transactionId, voucher){
  if(S.mode==='claude'){
    const assets = await claude.use('assets');
    if(!assets) throw new Error('Document storage is unavailable in this view.');
    const res = await assets.upload(file, {});
    await dbSet('documents', res.id, {
      name: file.name, contentType: res.contentType||file.type, sizeBytes: res.sizeBytes||file.size,
      transactionId: transactionId||null, voucher: voucher||null,
      uploadedBy: S.uid, uploadedByName: S.me.name, uploadedAt: new Date().toISOString(),
    });
    return res.id;
  }
  if(S.mode==='server'){
    const NETLIFY_ATTACHMENT_CAP = 4*1024*1024;
    if(file.size > NETLIFY_ATTACHMENT_CAP) throw new Error('Files over 4 MB are not supported. Please attach a smaller file.');
    const dataUrl = await fileToBase64(file);
    const base64 = dataUrl.split(',')[1];
    const res = await fetch('/api/upload', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({filename:file.name, contentType:file.type, dataBase64:base64}),
    });
    const json = await res.json().catch(()=>({}));
    if(!res.ok || !json.ok) throw new Error(json.error || 'Upload failed.');
    await dbSet('documents', json.id, {
      name: file.name, contentType: file.type||'application/octet-stream', sizeBytes: file.size,
      transactionId: transactionId||null, voucher: voucher||null,
      uploadedBy: S.uid, uploadedByName: S.me.name, uploadedAt: new Date().toISOString(),
    });
    return json.id;
  }
  // Standalone fallback: no asset store outside claude.ai, so the file is
  // kept as a data: URL inside the local document record. Capped well
  // under typical localStorage quotas (5–10 MB total per origin).
  const LOCAL_ATTACHMENT_CAP = 2*1024*1024;
  if(file.size > LOCAL_ATTACHMENT_CAP){
    throw new Error(`Files over 2 MB aren't supported when running outside claude.ai (this browser's local storage is limited). Open this app's claude.ai link for full-size document storage.`);
  }
  const dataUrl = await fileToBase64(file);
  const id = uuid();
  await dbSet('documents', id, {
    name: file.name, contentType: file.type||'application/octet-stream', sizeBytes: file.size,
    transactionId: transactionId||null, voucher: voucher||null,
    uploadedBy: S.uid, uploadedByName: S.me.name, uploadedAt: new Date().toISOString(),
    localData: dataUrl,
  });
  return id;
}

function attachmentHref(d){
  if(d.localData) return d.localData;
  if(S.mode==='server') return '/api/file?id='+encodeURIComponent(d.id);
  return '/_blob/'+d.id;
}
function attachmentListHtml(docs){
  if(!docs.length) return emptyInline('No documents attached.');
  return docs.map(d=>`
    <a href="${attachmentHref(d)}" ${d.localData? `download="${esc(d.name)}"` : 'target="_blank" rel="noopener"'} style="display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px; text-decoration:none; color:inherit;">
