<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Connectivo Invoice Portal</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2a57"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" type="image/png" sizes="32x32" href="/salary-assets/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/salary-assets/icon-192.png"><link rel="apple-touch-icon" href="/salary-assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1f8;--surface:#fff;--surface2:#f5f8fd;--line:#e1e8f3;--ink:#0e1a2e;--mut:#62728c;--brand:#1b6fb5;--brand2:#25b4ec;--ok:#0f9d6a;--warn:#d98a06;--err:#dc3545;--violet:#6d4aff;
--shadow:0 1px 2px rgba(12,24,48,.05),0 10px 30px -12px rgba(12,24,48,.14);--shadow2:0 2px 4px rgba(12,24,48,.06),0 22px 50px -18px rgba(12,24,48,.28);--r:16px;--hover:#f1f6fd;--ring:rgba(37,180,236,.28)}
html[data-theme=dark]{--bg:#060d1c;--surface:#0e1b33;--surface2:#12223f;--line:#1d3156;--ink:#e9f0fd;--mut:#8ea3c7;--hover:#132645;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);--shadow2:0 22px 50px -18px rgba(0,0,0,.75);--ring:rgba(37,180,236,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}button,.nav,.stab{-webkit-user-select:none;user-select:none;touch-action:manipulation}body{overscroll-behavior-y:none}html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 "Manrope",Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;background-image:radial-gradient(1100px 520px at 85% -10%,rgba(37,180,236,.13),transparent 60%),radial-gradient(900px 500px at 10% 0%,rgba(109,74,255,.07),transparent 60%);background-attachment:fixed}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:256px;background:linear-gradient(190deg,#0b2a57 0%,#08193a 45%,#050f22 100%);color:#c9d6ee;padding:18px 14px 14px;display:flex;flex-direction:column;z-index:30;overflow:hidden}
.side:before{content:"";position:absolute;inset:auto -80px -120px -80px;height:340px;background:radial-gradient(closest-side,rgba(37,180,236,.28),transparent);pointer-events:none}
.side:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 1px,transparent 1px 22px);pointer-events:none}
.side>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 18px}
.logo-tile{background:#fff;border-radius:13px;padding:7px 9px;box-shadow:0 8px 20px -6px rgba(0,0,0,.5);display:flex}.logo-tile img{height:30px;display:block}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}.brand small{display:block;color:#7fa2d6;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
#nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nsec{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#6283b8;padding:16px 12px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#c3d2ee;cursor:pointer;font-weight:600;transition:.18s;text-decoration:none!important;white-space:nowrap}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:linear-gradient(95deg,#1d7fd1,#1b6fb5 60%,#2a8fe0);color:#fff;box-shadow:0 10px 24px -8px rgba(37,150,236,.65),inset 0 1px 0 rgba(255,255,255,.22)}
.nav .pill{margin-left:auto;background:#ff4d6a;color:#fff;border-radius:20px;font-size:10.5px;font-weight:700;padding:1px 7px}
.side .foot{margin-top:10px;border-top:1px solid rgba(255,255,255,.09);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:rgba(255,255,255,.06)}.me b{display:block;color:#fff;font-size:13px}.me small{color:#8ba8d8;font-size:11.5px}
.tag{font-size:11px;color:#6f8fc4;line-height:1.5;border-left:2px solid #2a8fe0;margin:12px 4px 0;padding-left:10px}
/* top bar */
.content{margin-left:256px;min-height:100vh}
.top{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:14px;padding:0 28px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center}.crumb b{color:var(--ink);font-weight:700}
.sbk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px 6px 10px;font:700 13px "Manrope",sans-serif;cursor:pointer;box-shadow:var(--shadow)}.sbk:hover{border-color:var(--brand2);color:var(--brand)}
.iconbtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:.15s;margin-left:auto}.iconbtn:hover{transform:translateY(-1px);border-color:var(--brand2)}
main{padding:24px 28px 70px;max-width:1700px}
.page{animation:rise .35s cubic-bezier(.2,.7,.2,1)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:27px;letter-spacing:-.02em;font-weight:800;margin:0 0 4px;line-height:1.15}
h2{font-size:15px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sub{color:var(--mut);margin:0 0 18px;max-width:760px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}.card.scroll{overflow-x:auto}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.grid>.card{margin-bottom:0}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 30px;color:#fff;margin-bottom:18px;background:linear-gradient(120deg,#071b3d 0%,#0f3a76 55%,#1b6fb5 100%);box-shadow:var(--shadow2)}
.hero:before{content:"";position:absolute;right:-60px;top:-90px;width:380px;height:380px;border-radius:50%;background:radial-gradient(closest-side,rgba(78,205,255,.55),transparent)}
.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 1px,transparent 1px 26px)}
.hero>*{position:relative;z-index:1}.hero h1{color:#fff;font-size:28px}.hero p{margin:6px 0 16px;color:#bcd3f5;max-width:560px}
.kpi{display:flex;gap:14px;align-items:center}.kpi .ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}.kpi .ico .ic{width:23px;height:23px}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.kpi small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.k1{background:linear-gradient(135deg,#1b6fb5,#25b4ec)}.k2{background:linear-gradient(135deg,#f59e0b,#ffc95c)}.k3{background:linear-gradient(135deg,#dc3545,#ff7a89)}.k4{background:linear-gradient(135deg,#0f9d6a,#38d39f)}
/* buttons / inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:linear-gradient(135deg,#1b6fb5,#2a8fe0);color:#fff;padding:9px 16px;border-radius:12px;cursor:pointer;font:700 13.5px "Manrope",sans-serif;box-shadow:0 10px 20px -10px rgba(27,111,181,.8);transition:.15s;text-decoration:none!important;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.btn:active{transform:none}.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}.btn.sec:hover{border-color:var(--brand2);color:var(--brand)}
.btn.glass{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#d92d43,#f0586b);box-shadow:0 10px 20px -10px rgba(220,53,69,.8)}.btn.ok{background:linear-gradient(135deg,#0f9d6a,#2cc48c);box-shadow:0 10px 20px -10px rgba(15,157,106,.8)}.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:10px}
input,select,textarea{min-width:0;text-overflow:ellipsis;font:inherit;color:var(--ink);padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:100%;transition:.15s;min-height:40px}
input:hover,select:hover,textarea:hover{border-color:#b9c7dd}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 4px var(--ring)}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:var(--surface2)}
textarea{width:100%;line-height:1.5;resize:vertical}label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:700}.f{margin-bottom:12px;min-width:0}.f input,.f select{width:100%}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--brand)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
table{border-collapse:separate;border-spacing:0;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:800;background:var(--surface2);text-align:left;padding:12px 14px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
tbody tr.cl{cursor:pointer}tbody tr.cl:hover td{background:var(--hover)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.b-Draft{background:#eef1f6;color:#5b6b85;border-color:#dde4ef}.b-Sent{background:#e3f0ff;color:#1b5fa8;border-color:#bfd9f7}.b-Paid{background:#dcf6ea;color:#0b7a50;border-color:#a9e6cb}.b-Overdue{background:#ffe6e9;color:#b4232f;border-color:#f6bcc3}.b-Partially{background:#fff3da;color:#9a6200;border-color:#f6dfa8}.b-Cancelled{background:#f1e9ff;color:#6a3fc2;border-color:#d9c8fa;text-decoration:line-through}
html[data-theme=dark] .b-Draft{background:#1a2740;color:#9db0d0;border-color:#2a3d63}html[data-theme=dark] .b-Sent{background:#10284f;color:#8db4ff;border-color:#1d3f85}html[data-theme=dark] .b-Paid{background:#0b3326;color:#5fe3b0;border-color:#14553e}html[data-theme=dark] .b-Overdue{background:#3d1119;color:#ff8a98;border-color:#5f1c28}html[data-theme=dark] .b-Partially{background:#3a2a07;color:#ffc35a;border-color:#5b4311}
.mut{color:var(--mut)}.small{font-size:12.5px}.tc{text-align:center}.bold{font-weight:800}
.av{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;color:#fff;font-weight:800;font-size:12.5px;flex:none;box-shadow:inset 0 -6px 12px rgba(0,0,0,.15)}
.who{display:flex;align-items:center;gap:10px;min-width:0}.who b{display:block;font-weight:700;line-height:1.2}.who small{color:var(--mut);font-size:12px}
.seg{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink);padding:7px 14px;font:700 13px "Manrope",sans-serif}.seg button.on{background:var(--brand);color:#fff;box-shadow:0 6px 14px -6px rgba(27,111,181,.8)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chipb{border:1px solid var(--line);background:var(--surface);color:var(--mut);border-radius:99px;padding:3px 11px;font:700 11.5px "Manrope",sans-serif;cursor:pointer}.chipb:hover{border-color:var(--brand2);color:var(--brand)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{min-height:40px}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}.empty .ic{width:44px;height:44px;opacity:.45;margin-bottom:8px}.empty .btn .ic{width:18px;height:18px;opacity:1;margin:0}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.warnbox{background:linear-gradient(135deg,#fff7e3,#fff1ce);border:1px solid #f3d795;color:#7a5200;border-radius:14px;padding:12px 16px;margin-bottom:16px}
html[data-theme=dark] .xb:hover{background:#3d1119;color:#ff8a98}html[data-theme=dark] .warnbox{background:#33270a;border-color:#5b4311;color:#ffd78a}
.infobox{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px;color:var(--mut)}
.toast{position:fixed;right:24px;bottom:24px;background:#0e1a2e;color:#fff;padding:12px 18px;border-radius:14px;display:none;box-shadow:var(--shadow2);font-weight:700;z-index:200;border-left:4px solid #25b4ec}
/* modal */
.mo{position:fixed;inset:0;background:rgba(6,14,30,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fi .15s}@keyframes fi{from{opacity:0}to{opacity:1}}
.mbox{background:var(--surface);border-radius:20px;box-shadow:var(--shadow2);width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;border:1px solid var(--line)}.mbox.wide{width:min(820px,100%)}
.mhd{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.mhd h2{margin:0;font-size:17px;flex:1}.mx{border:0;background:var(--surface2);width:34px;height:34px;border-radius:10px;font-size:20px;cursor:pointer;color:var(--ink)}
.mbd{padding:20px;overflow:auto}.mft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* editor */
.edbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:64px;z-index:15;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);padding:10px 0}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,.82fr);gap:18px;align-items:start}
.edprev{position:sticky;top:132px}
.pvbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pvtabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--surface2)}.pvtabs button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:10px;font:700 12.5px "Manrope",sans-serif;color:var(--mut);cursor:pointer}.pvtabs button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.pvframe{width:100%;height:calc(100vh - 250px);min-height:520px;border:0;background:linear-gradient(#e6ecf6,#dbe4f2);overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pvpage{position:relative;box-shadow:0 2px 4px rgba(10,24,50,.12),0 18px 40px -14px rgba(10,24,50,.35);border-radius:3px;background:#fff;line-height:0;flex:none}.pvpage canvas{display:block;border-radius:3px}.pvno{position:absolute;right:8px;bottom:6px;font:700 10px Manrope,sans-serif;color:#7b8aa6;line-height:1}
.pvload{margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--mut);font-weight:700}.pvload i{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand2);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
html[data-theme=dark] .pvframe{background:linear-gradient(#0a1530,#0c1a38)}
.li{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.li .lg4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px;margin-top:10px}.lih{display:flex;align-items:center;gap:4px;margin-bottom:8px}.lih b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.lih .xb{width:34px;height:34px;display:grid;place-items:center}
.li input,.li select{width:100%;min-height:38px;padding:7px 10px}
.li .amt{font-weight:800;font-size:16px;padding:8px 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:800;margin-bottom:3px}
.xb{border:0;background:transparent;color:var(--mut);cursor:pointer;width:30px;height:34px;border-radius:9px}.xb:hover{background:#ffe6e9;color:var(--err)}
.tot{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-variant-numeric:tabular-nums;max-width:420px;margin-left:auto;margin-top:6px}.tot span:nth-child(odd){color:var(--mut)}.tot span:nth-child(even){text-align:right;font-weight:700}
.tot .due{font-size:18px;font-weight:800;color:var(--brand)}
.words{background:linear-gradient(90deg,rgba(37,180,236,.12),transparent);border-left:3px solid var(--brand2);border-radius:8px;padding:9px 14px;margin-top:12px;font-style:italic}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tl{display:flex;flex-direction:column;gap:12px}.tl div{position:relative;padding-left:20px;font-size:13px}.tl div:before{content:"";position:absolute;left:0;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand2);box-shadow:0 0 0 4px var(--ring)}
.menu{position:relative;display:inline-block}.menu>div{display:none}.mfloat{display:block!important;position:fixed;z-index:150;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2);min-width:200px;padding:6px}
.menu button,.mfloat button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--ink);font:600 13px "Manrope",sans-serif}.menu button:hover,.mfloat button:hover{background:var(--hover)}.mfloat button.red{color:var(--err)}.mbk{position:fixed;inset:0;background:rgba(6,14,30,.45);z-index:140}
.pay{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface2)}.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--brand)}.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}.pchip .ic{width:14px;height:14px}
.drop{display:flex!important;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:14px;padding:16px;cursor:pointer;color:var(--mut);font-weight:700;margin:0!important}.drop:hover{border-color:var(--brand2);color:var(--brand)}

 '<div class="card"><h2>'+ic("users")+'Client information</h2>'+(info.length?'<div class="grid g2" style="gap:6px 28px">'+info.map(function(r){return'<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="lbl">'+r[0]+'</div><div style="white-space:pre-line;overflow-wrap:anywhere">'+(r[0]=="Email"?r[1]:esc(r[1]))+"</div></div>"}).join("")+"</div>":'<p class="mut">No details saved yet. Use Edit to add them.</p>')+"</div>"+stats+
 '<div class="card pad0 scroll"><div class="row" style="padding:16px 18px 6px"><h2 style="margin:0">'+ic("file")+"Invoices ("+L.length+")</h2></div>"+(L.length?'<table class="tbl-m"><tr><th>Invoice</th><th class="hm">Date</th><th class="hm">Due</th><th class="n hm">Total</th><th class="n">Balance</th><th>Status</th></tr>'+L.map(function(i){var k=calc(i);return'<tr class="cl" onclick="go(\'edit\',\''+i.id+'\')"><td><b class="no">'+esc(i.no)+'</b><div class="small mut m9">'+fd(i.date)+'</div></td><td class="hm">'+fd(i.date)+'</td><td class="hm">'+fd(i.due)+'</td><td class="n hm">'+cmoney(i.cur,k.total)+'</td><td class="n"><b>'+cmoney(i.cur,k.due)+"</b></td><td>"+badge(stat(i))+"</td></tr>"}).join("")+"</table>":'<div class="empty">'+ic("file")+"<b>No invoices yet</b>Create the first invoice for this client.</div>")+"</div>"+
