<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Connectivo Payroll/Attendance Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1f8;--surface:#fff;--surface2:#f5f8fd;--line:#e1e8f3;--ink:#0e1a2e;--mut:#62728c;--brand:#1b6fb5;--brand2:#25b4ec;--navy:#071428;--navy2:#0d2750;--ok:#0f9d6a;--warn:#d98a06;--err:#dc3545;--violet:#6d4aff;
--shadow:0 1px 2px rgba(12,24,48,.05),0 10px 30px -12px rgba(12,24,48,.14);--shadow2:0 2px 4px rgba(12,24,48,.06),0 22px 50px -18px rgba(12,24,48,.28);--r:16px;--hover:#f1f6fd;--ring:rgba(37,180,236,.28)}
html[data-theme=dark]{--bg:#060d1c;--surface:#0e1b33;--surface2:#12223f;--line:#1d3156;--ink:#e9f0fd;--mut:#8ea3c7;--hover:#132645;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);--shadow2:0 22px 50px -18px rgba(0,0,0,.75);--ring:rgba(37,180,236,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
background-image:radial-gradient(1100px 520px at 85% -10%,rgba(37,180,236,.13),transparent 60%),radial-gradient(900px 500px at 10% 0%,rgba(109,74,255,.07),transparent 60%);background-attachment:fixed}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:268px;background:linear-gradient(190deg,#0b2a57 0%,#08193a 45%,#050f22 100%);color:#c9d6ee;padding:18px 14px 14px;display:flex;flex-direction:column;z-index:30;overflow:hidden}
.side:before{content:"";position:absolute;inset:auto -80px -120px -80px;height:340px;background:radial-gradient(closest-side,rgba(37,180,236,.28),transparent);pointer-events:none}
.side:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 1px,transparent 1px 22px);pointer-events:none}
.side>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 18px}
.logo-tile{background:#fff;border-radius:13px;padding:7px 9px;box-shadow:0 8px 20px -6px rgba(0,0,0,.5);display:flex}.logo-tile img{height:30px;display:block}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}.brand small{display:block;color:#7fa2d6;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
#nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;padding-right:2px}
.nsec{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#6283b8;padding:16px 12px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#c3d2ee;cursor:pointer;font-weight:500;transition:.18s;position:relative;text-decoration:none!important}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:linear-gradient(95deg,#1d7fd1,#1b6fb5 60%,#2a8fe0);color:#fff;box-shadow:0 10px 24px -8px rgba(37,150,236,.65),inset 0 1px 0 rgba(255,255,255,.22)}
.nav .pill{margin-left:auto;background:#ff4d6a;color:#fff;border-radius:20px;font-size:10.5px;font-weight:700;padding:1px 7px}
.side .foot{margin-top:10px;border-top:1px solid rgba(255,255,255,.09);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:rgba(255,255,255,.06)}
.me b{display:block;color:#fff;font-size:13px}.me small{color:#8ba8d8;font-size:11.5px}
.tag{font-size:11px;color:#6f8fc4;line-height:1.5;padding:10px 6px 0;border-left:2px solid #2a8fe0;margin:12px 4px 0;padding-left:10px}
/* top bar */
.content{margin-left:268px;min-height:100vh}
.top{position:sticky;top:0;z-index:20;height:68px;display:flex;align-items:center;gap:14px;padding:0 30px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center}.crumb b{color:var(--ink);font-weight:600}
.search{position:relative;margin-left:auto;width:340px;max-width:34vw}.search input{width:100%;padding-left:40px;height:42px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.search .ic{position:absolute;left:13px;top:12px;color:var(--mut)}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:var(--shadow);transition:.15s}
.iconbtn:hover{transform:translateY(-1px);border-color:var(--brand2)}.iconbtn i{position:absolute;top:-5px;right:-5px;background:#ff4d6a;color:#fff;font:700 10px/1 Inter,sans-serif;border-radius:10px;padding:3px 5px;font-style:normal;border:2px solid var(--bg)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;color:#fff;font-weight:700;font-size:12.5px;flex:none;letter-spacing:.3px;box-shadow:inset 0 -6px 12px rgba(0,0,0,.15),0 6px 14px -6px rgba(0,0,0,.35)}
.av.lg{width:46px;height:46px;border-radius:15px;font-size:15px}
.who{display:flex;align-items:center;gap:10px;min-width:0}.who b{display:block;font-weight:600;line-height:1.2}.who small{color:var(--mut);font-size:12px}
main{padding:26px 30px 60px;max-width:1640px}
.page{animation:rise .38s cubic-bezier(.2,.7,.2,1)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;letter-spacing:-.02em;font-weight:800;margin:0 0 4px;line-height:1.15}
h2{font-size:15px;font-weight:700;margin:0 0 12px;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.sub{color:var(--mut);margin:0 0 20px;max-width:780px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}.card.pad0{padding:0}.card.scroll{overflow-x:auto}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g31{grid-template-columns:minmax(0,1fr) 320px}
.grid>.card{margin-bottom:0}
/* hero + kpi */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 30px;color:#fff;margin-bottom:20px;background:linear-gradient(120deg,#071b3d 0%,#0f3a76 55%,#1b6fb5 100%);box-shadow:var(--shadow2)}
.hero:before{content:"";position:absolute;right:-60px;top:-90px;width:380px;height:380px;border-radius:50%;background:radial-gradient(closest-side,rgba(78,205,255,.55),transparent)}
.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 1px,transparent 1px 26px)}
.hero>*{position:relative;z-index:1}.hero h1{color:#fff;font-size:30px}.hero p{margin:6px 0 18px;color:#bcd3f5;max-width:560px}
.hero .due{position:absolute;right:30px;top:26px;text-align:right;z-index:1}.hero .due b{font-size:34px;display:block;line-height:1;letter-spacing:-.02em}.hero .due small{color:#a9c6f0;font-size:12px}
.kpi{display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.kpi .ico{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 12px 22px -10px currentColor}.kpi .ico .ic{width:24px;height:24px}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}.kpi small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
.kpi .spark{position:absolute;right:0;bottom:0;width:90px;height:44px;opacity:.5}
.c1{background:linear-gradient(135deg,#1b6fb5,#25b4ec);color:#1b6fb5}.c2{background:linear-gradient(135deg,#6d4aff,#a78bff);color:#6d4aff}.c3{background:linear-gradient(135deg,#f59e0b,#ffc95c);color:#f59e0b}.c4{background:linear-gradient(135deg,#0f9d6a,#38d39f);color:#0f9d6a}
.c1,.c2,.c3,.c4{color:#fff}.c1{--g:#1b6fb5}
/* buttons / inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:linear-gradient(135deg,#1b6fb5,#2a8fe0);color:#fff;padding:9px 16px;border-radius:12px;cursor:pointer;font:600 13.5px Inter,"Segoe UI",sans-serif;box-shadow:0 10px 20px -10px rgba(27,111,181,.85),inset 0 1px 0 rgba(255,255,255,.25);transition:.16s;text-decoration:none!important;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.btn:active{transform:none}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}.btn.sec:hover{border-color:var(--brand2);color:var(--brand)}
.btn.glass{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);box-shadow:none;backdrop-filter:blur(6px)}
.btn.red{background:linear-gradient(135deg,#d92d43,#f0586b);box-shadow:0 10px 20px -10px rgba(220,53,69,.8)}.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:10px}
.btn.ok{background:linear-gradient(135deg,#0f9d6a,#2cc48c)}
input,select,textarea{font:inherit;color:var(--ink);padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:100%;transition:.15s;min-height:40px}
input:hover,select:hover,textarea:hover{border-color:#b9c7dd}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 4px var(--ring)}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:var(--surface2)}
textarea{width:100%;line-height:1.55}label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}.f{margin-bottom:12px}.f input,.f select{width:100%}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--brand)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.scroll{overflow-x:auto}
/* tables */
table{border-collapse:separate;border-spacing:0;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:700;background:var(--surface2);text-align:left;padding:12px 14px;white-space:nowrap;position:sticky;top:0;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td,table tr:hover td{background:var(--hover)}tr:last-child td{border-bottom:0}th:first-child{border-top-left-radius:12px}th:last-child{border-top-right-radius:12px}
.n{text-align:right;font-variant-numeric:tabular-nums}tr.tot td{font-weight:800;background:var(--surface2)}
table input,table select{width:100%;min-width:60px;min-height:38px;padding:7px 10px}table input.t{width:86px;min-width:0;text-align:center;font-variant-numeric:tabular-nums}
.card.pad0 table th:first-child{border-top-left-radius:0}.card.pad0 table th:last-child{border-top-right-radius:0}
td a{color:var(--ink);font-weight:600}td a:hover{color:var(--brand)}
/* chips */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--mut);margin:2px 3px 2px 0;white-space:nowrap;border:1px solid var(--line)}
.badge.late{background:#fff3da;color:#9a6200;border-color:#f6dfa8}.badge.less,.badge.check{background:#ffe6e9;color:#b4232f;border-color:#f6bcc3}.badge.ot,.badge.ok{background:#dcf6ea;color:#0b7a50;border-color:#a9e6cb}
.badge.wfh{background:#e3edff;color:#2a4fb4;border-color:#bfd2fb}.badge.leave{background:#eee6ff;color:#5b34c2;border-color:#d4c3fa}
html[data-theme=dark] .badge.late{background:#3a2a07;color:#ffc35a;border-color:#5b4311}html[data-theme=dark] .badge.less,html[data-theme=dark] .badge.check{background:#3d1119;color:#ff8a98;border-color:#5f1c28}
html[data-theme=dark] .badge.ot,html[data-theme=dark] .badge.ok{background:#0b3326;color:#5fe3b0;border-color:#14553e}html[data-theme=dark] .badge.wfh{background:#10244f;color:#8db4ff;border-color:#1d3f85}html[data-theme=dark] .badge.leave{background:#241a4d;color:#c0a7ff;border-color:#3b2c80}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:64px;padding:3px 11px;border-radius:99px;color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.01em;box-shadow:inset 0 -6px 10px rgba(0,0,0,.12);white-space:nowrap}
.mut{color:var(--mut)}.small{font-size:12.5px}.tc{text-align:center}.live{font-weight:800;font-size:18px}
.scl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.scem{display:flex;gap:12px;align-items:flex-start;cursor:pointer;margin:0;transition:.15s}.scem:hover{border-color:var(--brand);transform:translateY(-2px)}
.scwk{display:grid;gap:10px;margin-top:16px}.scday{margin:0;padding:12px 16px}.scday.today{border-color:var(--brand);box-shadow:0 0 0 2px rgba(31,111,224,.15)}.scdh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.scs{border-left:4px solid #94a3b8;padding:6px 10px;margin:6px 0;background:var(--hover);border-radius:8px}.scs1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scmh,.scm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.scmh{margin-top:16px;font-weight:700;font-size:12px;color:var(--mut);text-align:center}.scc{min-height:96px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px}.scc.nil{background:transparent;border:0}.scc.today{border-color:var(--brand);box-shadow:0 0 0 2px rgba(31,111,224,.15)}.scn{font-weight:700;font-size:12px}.scwd{display:none;margin-left:6px;color:var(--mut);font-weight:500}
.scp{color:#fff;border-radius:6px;padding:3px 5px;margin-top:4px;font-size:10.5px;line-height:1.25}.scp small{display:block;opacity:.9;font-size:9.5px}
html.m .scmh{display:none}html.m .scm{grid-template-columns:1fr}html.m .scc.empty,html.m .scc.nil{display:none}html.m .scc{min-height:0}html.m .scwd{display:inline}html.m .scp{font-size:12px}
.seg button.on{background:var(--brand);color:#fff}
.pfrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.pfrow .seg{margin-bottom:0 !important}.pfs{display:flex;gap:8px;flex-wrap:wrap}.pf{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;font-weight:600;box-shadow:var(--shadow)}.pf svg{width:17px;height:17px;color:#e0a526}.pf i{font-style:normal;font-size:11px;background:var(--hover);border-radius:20px;padding:1px 7px;color:var(--mut)}.pf:hover,.pf.on{border-color:var(--brand);color:var(--brand)}.pf.on{background:var(--hover)}
.seg{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow);gap:2px}
.seg button{width:34px;height:34px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink);display:grid;place-items:center}.seg button:hover{background:var(--hover);color:var(--brand)}
.seg b{min-width:150px;text-align:center;font-weight:700;padding:0 6px}.seg input{border:0;background:transparent;box-shadow:none;width:36px;min-height:34px;padding:0;cursor:pointer;color:transparent}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:18px}
.tabs a{padding:8px 18px;border-radius:10px;color:var(--mut);font-weight:600;cursor:pointer;text-decoration:none!important}.tabs a.on{background:linear-gradient(135deg,#1b6fb5,#2a8fe0);color:#fff;box-shadow:0 8px 16px -8px rgba(27,111,181,.8)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.warnbox{background:linear-gradient(135deg,#fff7e3,#fff1ce);border:1px solid #f3d795;color:#7a5200;border-radius:14px;padding:12px 16px;margin-bottom:16px}
html[data-theme=dark] .warnbox{background:#33270a;border-color:#5b4311;color:#ffd78a}
.toast{position:fixed;right:24px;bottom:24px;background:#0e1a2e;color:#fff;padding:12px 18px;border-radius:14px;display:none;box-shadow:var(--shadow2);font-weight:600;z-index:99;border-left:4px solid #25b4ec}
/* dashboard bits */
.bars{display:flex;flex-direction:column;gap:12px}.bar{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;font-size:13px}.bar i{display:block;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;font-style:normal}.bar i s{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f59e0b,#ffc95c);text-decoration:none}
.seq{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2)}.seq s{display:block;text-decoration:none}
.tl{display:flex;flex-direction:column;gap:14px}.tl div{position:relative;padding-left:20px;font-size:13px}.tl div:before{content:"";position:absolute;left:0;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand2);box-shadow:0 0 0 4px var(--ring)}.tl small{display:block;color:var(--mut)}
.attn{display:flex;flex-direction:column;gap:10px}.attn .it{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);cursor:pointer;transition:.15s}.attn .it:hover{border-color:var(--brand2);transform:translateX(2px)}
.empty{text-align:center;padding:34px 10px;color:var(--mut)}.empty .ic{width:42px;height:42px;opacity:.5;margin-bottom:8px}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
/* sheet view */
.dayhd td{background:linear-gradient(90deg,var(--surface2),transparent);font-weight:800;padding:12px 14px;border-top:1px solid var(--line)}.dayhd .st{float:right;font-weight:600;font-size:11.5px;color:var(--mut)}.dayhd .st span{margin-left:14px}
.rm{display:inline-block;padding:3px 10px;border-radius:8px;font-size:11.5px;font-weight:600;margin:1px 3px 1px 0}.rm.bad{background:#ffe6e9;color:#b4232f}.rm.good{background:#dcf6ea;color:#0b7a50}.rm.note{background:var(--surface2);color:var(--mut)}
html[data-theme=dark] .rm.bad{background:#3d1119;color:#ff8a98}html[data-theme=dark] .rm.good{background:#0b3326;color:#5fe3b0}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}.sumgrid div{padding:14px 4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}.sumgrid b{display:block;font-size:26px;letter-spacing:-.03em}.sumgrid small{color:var(--mut);font-size:11.5px;font-weight:600}
.legend{display:flex;flex-direction:column;gap:10px}.legend div{display:flex;align-items:center;gap:10px}.legend small{margin-left:auto;color:var(--mut)}.dot{width:12px;height:12px;border-radius:50%}
.promo{border-radius:18px;padding:20px;color:#fff;background:linear-gradient(130deg,#0d2e63,#1b6fb5 60%,#25b4ec);box-shadow:var(--shadow2);position:relative;overflow:hidden}.promo:before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}.promo b{display:block;font-size:16px;margin-bottom:4px}.promo small{color:#cfe3ff}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.lens{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g31,.g21{grid-template-columns:1fr}.search{display:none}}
